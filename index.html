<style>

:root{color-scheme:light dark;--bg:light-dark(#ffffff,#121419);--paper:light-dark(#f6f5f1,#1b1e25);--ink:light-dark(#16181d,#ecebe6);--mute:light-dark(#5b5f6d,#a5a9b5);--line:light-dark(#dcdad2,#30343e);--blue:light-dark(#1f5fbf,#8ab6ff);--hl:#ffd84d;--hls:light-dark(#fff1b3,#4a4120);--red:#e0394a;--ok:light-dark(#1d7a46,#72d59d);--bad:light-dark(#b3261e,#ff8a80)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Source Sans 3",system-ui,sans-serif;overflow-x:clip}
a{color:var(--blue)}
.wrap{max-width:calc(760px + 2*max(4vw,16px));margin:0 auto;padding:28px max(4vw,16px) 64px}
.wrap.wide{max-width:1180px}
header.mast{text-align:center;padding:18px max(4vw,16px) 0}
.mast h1{font:400 clamp(40px,9vw,68px)/1 "UnifrakturMaguntia",serif;margin:0;letter-spacing:.5px}
.mast h1 a{color:inherit;text-decoration:none}
.mast .sub{font-size:14px;color:var(--mute);margin:4px 0 10px}
.rule{border-top:2px solid var(--ink);border-bottom:1px solid var(--ink);height:5px;max-width:760px;margin:0 auto}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;max-width:760px;margin:8px auto 0;font-size:14px;font-weight:600}
.tag{display:inline-block;background:var(--hl);color:#16181d;font:700 17px/1.2 "Kalam",cursive;padding:3px 10px 1px;transform:rotate(-1.5deg);border-radius:3px}
h2.t{font:600 clamp(28px,6vw,40px)/1.08 "Fredoka",sans-serif;color:var(--blue);margin:14px 0 6px;text-wrap:balance}
h3{font:600 20px/1.2 "Fredoka",sans-serif;margin:0 0 10px}
.lead{color:var(--mute);margin:0 0 18px}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}
.btn{font:600 16px "Source Sans 3",sans-serif;min-height:44px;padding:8px 18px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.sm{min-height:36px;padding:4px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.opts{display:grid;gap:8px}
.opt{position:relative;overflow:hidden;text-align:left;min-height:48px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:600 16px "Source Sans 3",sans-serif;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}

.opt.mine{border-color:var(--ink)}
.opt.right{border-color:var(--ok)}.opt.wrong{border-color:var(--bad)}
.pct{font-variant-numeric:tabular-nums;white-space:nowrap}
.react{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.react button{min-height:72px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font:600 14px "Source Sans 3",sans-serif;display:grid;place-items:center;gap:0;padding:6px}

.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:14px;display:flex;gap:6px;align-items:center}
.chip button{border:0;background:none;color:var(--mute);font-size:18px;cursor:pointer;width:28px;height:28px}
.art{border-top:1.5px solid var(--line);padding-top:12px;margin-top:12px}
.flag{background:var(--hls);border-radius:6px;padding:0 6px;font-size:13px;font-weight:700}
.res .opt{cursor:default;min-height:38px;padding:6px 12px;font-size:15px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.th{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:6px;align-content:start}
.th img,.th .ph{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;background:var(--paper)}
.th .ph{display:grid;place-items:center;color:var(--mute);font-size:13px}
.th input{padding:6px 8px;font-size:15px}
.thb{display:flex;gap:6px;align-items:center}.thb b{flex:1 1 auto}.thb .btn{min-height:34px;min-width:34px;padding:0 8px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin-top:14px}
.chk input{width:22px;height:22px;flex:none;margin:2px 0 0}
.texto{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;max-height:520px;overflow:auto}
.notaeq{background:var(--hls);border-radius:10px;padding:10px 12px;margin-top:10px}
.est{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;border:1.5px solid var(--line);white-space:nowrap}
.est-recebido,.est-revisao{border-color:var(--blue);color:var(--blue)}.est-alteracoes{border-color:var(--hl);background:var(--hls)}.est-aceite,.est-publicado{border-color:var(--ok);color:var(--ok)}.est-recusado{border-color:var(--bad);color:var(--bad)}
.ver{display:inline-block;font-size:12px;font-weight:700;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:0 7px;margin-left:2px;vertical-align:1px}
.hide{display:none!important}
pre{overflow-x:auto;background:var(--paper);padding:12px;border-radius:10px;font-size:13px}
@media(max-width:600px){.react button{min-height:64px}.list li a{grid-template-columns:48px 1fr}.list .n{display:none}}
@media(prefers-reduced-motion:reduce){.opt .bar{transition:none}}
</style>
</head>

const idb={h:null,mem:new Map(),
 async open(){if(this.h===null)this.h=await new Promise(ok=>{try{const r=indexedDB.open('rc-fotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(false)}catch(e){ok(false)}});return this.h},

 async editarSub(id,s){const x=this.L().find(y=>y.id===id);if(!x)return;const c=Object.assign({},s);if(!prof){delete c.nota_equipa;delete c.pagina;delete c.edicao;c.estado='recebido'}Object.assign(x,c,{atualizado:new Date().toISOString()});this.save()},
 async minhas(){return this.L().filter(x=>x.autor===dev).sort((a,b)=>a.criado<b.criado?1:-1)},
 async subs(){return this.L().slice().sort((a,b)=>a.criado<b.criado?1:-1)},
 async apagarSub(s){for(const f of s.fotos||[])await idb.del(f.path);this.d.subs=this.L().filter(y=>y.id!==s.id);this.save()},
 async subirFoto(b,ext){const p=dev+'/'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)+'.'+ext;await idb.put(p,b);return p},
 async urlsFotos(paths){const o={};for(const p of paths){const b=await idb.get(p);if(b)o[p]=URL.createObjectURL(b)}return o},
 async blobFoto(p){return idb.get(p)},
 async apagarFotos(paths){for(const p of paths)await idb.del(p)}
};

/* ======== Base de dados: Supabase (online, partilhada) ======== */
function supa(cl){
 const chk=r=>{if(r.error)throw r.error;return r.data};
 return {
  cl,
  async edicoes(){return chk(await cl.from('edicoes').select('dados').order('numero')).map(r=>r.dados)},
  async destaque(){const d=chk(await cl.from('definicoes').select('valor').eq('chave','destaque').maybeSingle());return d?Number(d.valor):null},
  async setDestaque(n){chk(await cl.from('definicoes').upsert({chave:'destaque',valor:String(n)}))},
  async guardarEdicao(e){chk(await cl.from('edicoes').upsert({numero:e.n,dados:e}))},
  async apagarEdicao(n){chk(await cl.from('edicoes').delete().eq('numero',n))},
  async todasContagens(ed){const out={};chk(await cl.rpc('contagens_edicao',{p_edicao:ed})).forEach(r=>{const a=out[r.artigo]=out[r.artigo]||{};(a[r.chave]=a[r.chave]||{})[r.opcao]=Number(r.total)});return out},
  async contagens(ed,art){return (await this.todasContagens(ed))[art]||{}},
  async meus(ed,art){const out={};chk(await cl.from('votos').select('chave,opcao').eq('edicao',ed).eq('artigo',art)).forEach(r=>out[r.chave]=r.opcao);return out},
  async votar(ed,art,ch,op){if(op==null)chk(await cl.from('votos').delete().match({edicao:ed,artigo:art,chave:ch}));else chk(await cl.from('votos').upsert({edicao:ed,artigo:art,chave:ch,opcao:op},{onConflict:'edicao,artigo,chave,utilizador'}))},
  async comentar(c){chk(await cl.from('comentarios').insert({edicao:c.ed,artigo:c.art,tipo:c.tipo,nome:c.nome,turma:c.turma,texto:c.texto}))},
  async comentarios(f){let q=cl.from('comentarios').select('*').order('criado',{ascending:false});if(f.ed)q=q.eq('edicao',f.ed);if(f.art)q=q.eq('artigo',f.art);if(f.estado)q=q.eq('estado',f.estado);if(f.tipo)q=q.eq('tipo',f.tipo);return chk(await q).map(r=>({id:r.id,ed:r.edicao,art:r.artigo,tipo:r.tipo,nome:r.nome,turma:r.turma,texto:r.texto,estado:r.estado,criado:r.criado}))},
  async moderar(id,estado){chk(await cl.from('comentarios').update({estado}).eq('id',id))},
  async uid(){const {data}=await cl.auth.getSession();return data.session?.user?.id},
  async eRedator(){return !!chk(await cl.rpc('e_redator'))},
  async entrarRedacao(c){return !!chk(await cl.rpc('entrar_redacao',{p_codigo:String(c)}))},
  async redacaoInfo(){const d=chk(await cl.from('definicoes').select('valor').eq('chave','redacao').maybeSingle());try{return d?JSON.parse(d.valor):{}}catch(e){return {}}},
  async setRedacaoInfo(o){chk(await cl.from('definicoes').upsert({chave:'redacao',valor:JSON.stringify(o)}))},
  async codigoRedacao(){return chk(await cl.rpc('ver_codigo_redacao'))||''},
  async setCodigoRedacao(c){chk(await cl.rpc('definir_codigo_redacao',{p_codigo:c}))},
  async limparRedatores(){chk(await cl.rpc('limpar_redatores'))},
  async submeter(s){return chk(await cl.from('submissoes').insert(s).select('id').single()).id},
  async editarSub(id,s){chk(await cl.from('submissoes').update(s).eq('id',id))},
  async minhas(){const u=await this.uid();return chk(await cl.from('submissoes').select('*').eq('autor',u).order('criado',{ascending:false}))},
  async subs(){return chk(await cl.from('submissoes').select('*').order('criado',{ascending:false}))},
  async apagarSub(s){const p=(s.fotos||[]).map(f=>f.path);if(p.length)await cl.storage.from('submissoes').remove(p);chk(await cl.from('submissoes').delete().eq('id',s.id))},
  async subirFoto(b,ext){const path=(await this.uid())+'/'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)+'.'+ext;chk(await cl.storage.from('submissoes').upload(path,b,{contentType:b.type||'image/jpeg'}));return path},
  async urlsFotos(paths){const o={};if(!paths.length)return o;chk(await cl.storage.from('submissoes').createSignedUrls(paths,3600)).forEach(x=>{if(x.signedUrl)o[x.path]=x.signedUrl});return o},
  async blobFoto(p){return chk(await cl.storage.from('submissoes').download(p))},
  async apagarFotos(paths){if(paths.length)chk(await cl.storage.from('submissoes').remove(paths))}
 };
}

let db=local,modo='demo',prof=false,eds=[],dest=1;
const loadScript=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)});

 </div>`;

const soma=o=>Object.values(o||{}).reduce((x,y)=>x+y,0);
function bloco(b,bi,cont,meus,coms){
 const ch=String(bi),c=cont[ch]||{},mine=meus[ch];
 if(b.t==='reacoes')return `<div class="card"><h3>Reage a este artigo</h3><div class="react">${REACOES.map(([k,em,lb])=>`<button data-act="vote" data-ch="${ch}" data-op="${k}" data-toggle="1" class="${mine===k?'mine':''}" aria-pressed="${mine===k}"><b>${em}</b>${lb} · ${c[k]||0}</button>`).join('')}</div></div>`;
 if(b.t==='fotos'){let h='';for(let k=1;k<=b.n;k++){const kk=bi+':'+k,on=meus[kk]!=null,n=soma(cont[kk]);h+=`<button data-act="foto" data-ch="${kk}" class="${on?'mine':''}" aria-pressed="${on}" aria-label="Gosto na foto ${k}">Foto ${k}<i>${on?'♥':'♡'} ${n}</i></button>`}
  return `<div class="card"><h3>Qual é a tua foto preferida?</h3><div class="fotos">${h}</div><p class="note">Os números seguem a ordem das fotos na página do jornal, da esquerda para a direita e de cima para baixo. Podes gostar de várias.</p></div>`}
 if(b.t==='sondagem'||b.t==='quiz'){
  const tot=soma(c),quiz=b.t==='quiz',done=mine!=null,show=done;
  const opts=b.o.map((o,oi)=>{const k=String(oi),n=c[k]||0,p=tot?Math.round(n*100/tot):0;
   let cls=mine===k?'mine':'';if(quiz&&done){if(oi===b.c)cls+=' right';else if(mine===k)cls+=' wrong'}
   return `<button class="opt ${cls}" data-act="vote" data-ch="${ch}" data-op="${k}" ${quiz&&done?'disabled':''}>${show?`<span class="bar" style="width:${p}%"></span>`:''}<span>${esc(o)}${quiz&&done&&oi===b.c?' ✓':''}</span>${show?`<span class="pct">${p}%</span>`:''}</button>`}).join('');
  const fim=quiz?(done?(Number(mine)===b.c?'<p class="ok">Certo! Bem lido.</p>':'<p class="err">Não é bem isso. A resposta certa está assinalada.</p>'):'<p class="note">Escolhe uma resposta. Só tens uma tentativa!</p>'):(done?`<p class="note">${tot} ${tot===1?'voto':'votos'}. Podes mudar o teu voto.</p>`:'<p class="note">Vota para veres os resultados.</p>');
  return `<div class="card"><h3>${quiz?'Quiz: ':''}${esc(b.q)}</h3><div class="opts">${opts}</div>${fim}</div>`}
 if(b.t==='estrelas'){const v=Number(mine||0),tot=soma(c);let s=0;for(const k in c)s+=Number(k)*c[k];
  return `<div class="card"><h3>${esc(b.q)}</h3><div class="stars" role="group">${[1,2,3,4,5].map(k=>`<button data-act="vote" data-ch="${ch}" data-op="${k}" class="${k<=v?'on':''}" aria-label="${k} de 5">★</button>`).join('')}</div><p class="note">${v?`Média: ${(s/tot).toFixed(1)} em 5 · ${tot} ${tot===1?'voto':'votos'}`:'Toca nas estrelas para dar a tua nota.'}</p></div>`}
 if(b.t==='comentario'||b.t==='sugestao'){const sug=b.t==='sugestao';
  return `<div class="card"><h3>${esc(b.q||(sug?'Tens uma sugestão?':'Deixa a tua opinião'))}</h3>
  <form data-form="${b.t}"><div class="row"><div><label for="n${bi}">Primeiro nome ou alcunha</label><input id="n${bi}" name="nome" maxlength="30" autocomplete="off"></div><div style="flex:0 1 120px"><label for="t${bi}">Turma</label><input id="t${bi}" name="turma" maxlength="10" placeholder="ex.: 8.º A" autocomplete="off"></div></div>
  <label for="x${bi}">${sug?'A tua sugestão':'O teu comentário'}</label><textarea id="x${bi}" name="texto" maxlength="400" required></textarea>
  <div class="row" style="margin-top:10px"><button class="btn pri" style="flex:0 0 auto">Enviar</button><span class="msg"></span></div>
  <p class="note">${sug?'Só a equipa do jornal lê as sugestões.':'Os comentários aparecem depois de um professor os aprovar.'} Não escrevas apelidos, moradas, telefones nem nada sobre outras pessoas.</p></form>
  ${sug?'':`<ul class="coms">${coms.length?coms.map(x=>`<li><small>${esc(x.nome||'Anónimo')}${x.turma?' · '+esc(x.turma):''}</small><br>${esc(x.texto)}</li>`).join(''):'<li class="note">Ainda não há comentários aprovados. Sê o primeiro!</li>'}</ul>`}</div>`}
 return '';
}

  if(d.del){if(confirmar==='del'+d.del){await db.apagarEdicao(Number(d.del));confirmar=null;await carregar()}else confirmar='del'+d.del;painel()}};

function parseImport(txt){
 txt=txt.trim();if(!txt)return [];
 if(txt[0]==='{'||txt[0]==='['){const j=JSON.parse(txt);return {json:j}}
 const usados=new Set();
 return txt.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split('|').map(x=>x.trim());
  let pag='',sec='',ti=l;if(p.length>=3){[pag,sec]=p;ti=p.slice(2).join(' ')}else if(p.length===2){[pag,ti]=p}
  let id=slug(ti),k=2;while(usados.has(id))id=slug(ti)+'-'+k++;usados.add(id);
  return {id,p:pag.replace(/\D/g,'')||pag,s:sec||'Notícias',ti,b:[{t:'reacoes'},{t:'comentario',q:'Deixa a tua opinião'}]}});
}

/* --- Códigos QR --- */
function qrImg(url,titulo,sub){
 if(!window.qrcode)return '';
 const qr=window.qrcode(0,'M');qr.addData(url);qr.make();
 const n=qr.getModuleCount(),cell=10,m=4*cell,W=n*cell+2*m,H=W+64;
 const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
 x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#16181d';
 for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(qr.isDark(r,k))x.fillRect(m+k*cell,m+r*cell,cell,cell);
 x.textAlign='center';x.font='600 26px Fredoka, sans-serif';x.fillText(titulo,W/2,W+14);
 x.font='18px "Source Sans 3", sans-serif';let s=sub;while(x.measureText(s).width>W-24&&s.length>4)s=s.slice(0,-2);if(s!==sub)s=s.trim()+'…';x.fillText(s,W/2,W+44);
 return c.toDataURL('image/png');
}

/* Reduz para 2400 px e regrava em JPG: a foto fica leve e perde a localização GPS. */
async function comprimir(file){
 try{const bm=await createImageBitmap(file),s=Math.min(1,2400/Math.max(bm.width,bm.height)),c=document.createElement('canvas');
  c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bm,0,0,c.width,c.height);if(bm.close)bm.close();
  const b=await new Promise(ok=>c.toBlob(ok,'image/jpeg',.88));if(b)return b}catch(e){}
 if(file.size<=10e6&&/^image\//.test(file.type))return file;
 throw new Error('imagem');
}

 if(info.aberta===false&&!f.id){rp.innerHTML='<div class="card">A redação está fechada: o próximo número já está a ser montado. Se tens um texto urgente, fala com o professor responsável pelo jornal.</div>';return}
 rp.innerHTML=`<form id="rf" novalidate>
 ${f.id&&f.nota_equipa?`<div class="notaeq"><b>Nota da equipa:</b> ${esc(f.nota_equipa)}</div>`:''}
 <div class="card"><h3>O artigo</h3>
  <label for="r-s" style="margin-top:0">Secção</label><input id="r-s" name="seccao" list="r-sl" maxlength="40" value="${esc(f.seccao)}" placeholder="ex.: Notícias"><datalist id="r-sl">${secoes().map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
  <label for="r-t">Título</label><input id="r-t" name="titulo" maxlength="140" value="${esc(f.titulo)}">
  <label for="r-e">Entrada (opcional)</label><textarea id="r-e" name="entrada" maxlength="400" style="min-height:64px" placeholder="Uma ou duas frases que resumem o artigo">${esc(f.entrada)}</textarea>
  <label for="r-x">Texto</label><textarea id="r-x" name="texto" maxlength="20000" style="min-height:280px">${esc(f.texto)}</textarea>
  <p class="note" id="r-pal"></p></div>
 <div class="card"><h3>Quem escreveu</h3>
  <div class="row"><div style="flex:3 1 220px"><label for="r-a" style="margin-top:0">Nomes como devem sair no jornal</label><input id="r-a" name="autores" maxlength="200" value="${esc(f.autores)}" placeholder="ex.: Ana S. e Rui M."></div><div style="flex:1 1 120px"><label for="r-tu" style="margin-top:0">Turma ou cargo</label><input id="r-tu" name="turma" maxlength="40" value="${esc(f.turma)}" placeholder="ex.: 8.º A"></div></div></div>
 <div class="card"><h3>Fotografias</h3>
  <div class="thumbs" id="r-th"></div>
  <button type="button" class="btn" id="r-fb" style="margin-top:12px">+ Acrescentar fotos</button><input id="r-f" type="file" accept="image/*" multiple class="hide">
  <p class="note">Até ${MAXF} fotos, pela ordem que sugeres para a página: é essa a numeração que os leitores usam para votar na foto preferida.</p>
  <label for="r-c">Fotografias de (créditos)</label><input id="r-c" name="creditos_fotos" maxlength="120" value="${esc(f.creditos_fotos)}">
  <label class="chk"><input type="checkbox" id="r-au" ${f.autorizacao?'checked':''}> As pessoas que aparecem nas fotos têm autorização de imagem da escola, ou não se lhes vê a cara.</label></div>
 <div class="card"><h3>Pergunta para os leitores (opcional)</h3>
  <p class="note" style="margin-top:0">Aparece na Participa, na página que o QR do teu artigo abre.</p>
  <label for="r-pt">Tipo</label><select id="r-pt" name="pt"><option value="">Sem pergunta</option><option value="sondagem" ${f.pt==='sondagem'?'selected':''}>Votação (opinião)</option><option value="quiz" ${f.pt==='quiz'?'selected':''}>Quiz (há uma resposta certa)</option></select>
  <div id="r-pw" class="${f.pt?'':'hide'}"><label for="r-pq">Pergunta</label><input id="r-pq" name="pq" maxlength="160" value="${esc(f.pq)}"><label for="r-po">Opções, uma por linha</label><textarea id="r-po" name="po" maxlength="600" placeholder="No quiz, põe * antes da resposta certa">${esc(f.po)}</textarea></div></div>
 <div class="card"><label for="r-n" style="margin-top:0">Recado para a equipa do jornal (opcional)</label><textarea id="r-n" name="notas" maxlength="600" style="min-height:64px">${esc(f.notas)}</textarea></div>
 <div class="row"><button class="btn pri" style="flex:0 0 auto">${f.id?'Enviar correções':'Enviar para a redação'}</button>${f.id?'<button class="btn" type="button" id="r-cancel" style="flex:0 0 auto">Cancelar</button>':''}<span class="msg" id="r-msg"></span></div>
 <p class="note">Nos nomes, só o primeiro nome e a inicial. Não escrevas moradas, telefones nem coisas privadas sobre outras pessoas.</p></form>`;
 const form=$('#rf'),m=$('#r-msg'),T=s=>String(s||'').trim();
 const sync=()=>{const fd=new FormData(form);CAMPOS.forEach(k=>f[k]=String(fd.get(k)??''));f.autorizacao=$('#r-au').checked;form.querySelectorAll('[data-leg]').forEach(x=>{const o=f.fotos[x.dataset.leg];if(o)o.legenda=x.value})};
 const thumbs=()=>{$('#r-th').innerHTML=f.fotos.map((x,i)=>`<div class="th">${x.url?`<img src="${esc(x.url)}" alt="Foto ${i+1}">`:'<div class="ph">sem pré-visualização</div>'}<div class="thb"><b>Foto ${i+1}</b>${i?`<button type="button" class="btn sm" data-up="${i}" aria-label="Passar a foto ${i+1} para antes">←</button>`:''}<button type="button" class="btn sm" data-rmf="${i}" aria-label="Retirar a foto ${i+1}">×</button></div><input data-leg="${i}" maxlength="160" placeholder="Legenda" aria-label="Legenda da foto ${i+1}" value="${esc(x.legenda||'')}"></div>`).join('')||'<p class="note" style="margin:0">Ainda sem fotos.</p>'};
 const pal=()=>{const n=palavras($('#r-x').value);$('#r-pal').textContent=n+(n===1?' palavra':' palavras')+'. Como referência, uma página com 2 ou 3 fotos leva cerca de 300 a 400 palavras.'};
 const onIn=ev=>{sync();if(ev.target.id==='r-x')pal();if(ev.target.id==='r-pt')$('#r-pw').classList.toggle('hide',!f.pt);if(!f.id)LS.set('rc-rascunho',Object.fromEntries(CAMPOS.map(k=>[k,f[k]])))};
 form.addEventListener('input',onIn);form.addEventListener('change',onIn);
 thumbs();pal();
 $('#r-fb').onclick=()=>$('#r-f').click();
 $('#r-f').onchange=async()=>{sync();const fs=[...$('#r-f').files];$('#r-f').value='';let erro='';
  for(const file of fs){if(f.fotos.length>=MAXF){erro='Máximo de '+MAXF+' fotos.';break}
   m.className='msg';m.textContent='A preparar '+file.name+'…';
   try{const blob=await comprimir(file);f.fotos.push({blob,url:URL.createObjectURL(blob),legenda:'',nome:file.name})}catch(e){erro=file.name+': não consegui abrir esta imagem. Experimenta em JPG ou PNG.'}}
  m.className=erro?'msg err':'msg';m.textContent=erro;thumbs()};
 $('#r-th').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;sync();
  if(b.dataset.rmf){const [x]=f.fotos.splice(Number(b.dataset.rmf),1);if(x&&x.path)f.removidas.push(x.path)}
  if(b.dataset.up){const i=Number(b.dataset.up);[f.fotos[i-1],f.fotos[i]]=[f.fotos[i],f.fotos[i-1]]}
  thumbs()};
 const cc=$('#r-cancel');if(cc)cc.onclick=()=>{rForm=null;rAba='meus';redacao()};
 form.onsubmit=async ev=>{ev.preventDefault();sync();const err=t=>{m.className='msg err';m.textContent=t};
  if(T(f.titulo).length<3)return err('Falta o título.');
  if(palavras(f.texto)<20)return err('O texto está muito curto.');
  if(!T(f.autores))return err('Escreve quem escreveu o artigo.');
  if(f.fotos.length&&!f.autorizacao)return err('Confirma a autorização de imagem das fotos.');
  let pergunta=null;
  if(f.pt){const os=f.po.split('\n').map(T).filter(Boolean);if(!T(f.pq)||os.length<2)return err('A pergunta precisa de texto e de pelo menos duas opções.');
   pergunta={t:f.pt,q:T(f.pq),o:os.slice(0,8).map(o=>o.replace(/^\*\s*/,''))};
   if(f.pt==='quiz'){const c=os.slice(0,8).findIndex(o=>o.startsWith('*'));if(c<0)return err('No quiz, marca a resposta certa com * no início da linha.');pergunta.c=c}}
  const btn=form.querySelector('button.pri');btn.disabled=true;
  try{const fotos=[];let k=0;
   for(const x of f.fotos){if(!x.path){m.className='msg';m.textContent=`A enviar a foto ${++k}…`;x.path=await db.subirFoto(x.blob,extDe(x.blob))}fotos.push({path:x.path,legenda:T(x.legenda),nome:x.nome||''})}
   const dados={seccao:T(f.seccao),titulo:T(f.titulo),entrada:T(f.entrada),texto:T(f.texto),autores:T(f.autores),turma:T(f.turma),creditos_fotos:T(f.creditos_fotos),notas:T(f.notas),pergunta,fotos,autorizacao:!!f.autorizacao};
   if(f.id){await db.editarSub(f.id,dados);if(f.removidas.length)await db.apagarFotos(f.removidas).catch(e=>console.warn(e))}
   else{dados.edicao=Number(info.edicao)||null;await db.submeter(dados);LS.set('rc-rascunho',null)}
   rMsg=f.id?'Correções enviadas. A equipa vai voltar a ler.':'Recebido, obrigado! Acompanha aqui o estado do teu artigo.';rForm=null;rAba='meus';redacao()}
  catch(e){console.warn(e);err('Não foi possível enviar. Verifica a ligação à internet e tenta outra vez.');btn.disabled=false}};
}

function rMeus(lista){
 const rp=$('#rpane');
 rp.innerHTML=`${rMsg?`<p class="ok">${esc(rMsg)}</p>`:''}${lista.map(s=>{const nf=(s.fotos||[]).length;return `<div class="card"><div class="row" style="align-items:center"><div style="flex:3 1 220px"><span class="lt">${esc(s.titulo)}</span><span class="ls">${esc(s.seccao||'Sem secção')} · ${palavras(s.texto)} palavras · ${nf} ${nf===1?'foto':'fotos'} · enviado a ${esc(new Date(s.criado).toLocaleDateString('pt-PT'))}</span></div><div style="flex:0 0 auto">${estTag(s.estado)}</div></div>
 <p class="note">${esc((ESTADOS[s.estado]||['',''])[1])}${(s.estado==='aceite'||s.estado==='publicado')&&s.edicao?' N.º'+esc(s.edicao)+(s.pagina?', pág. '+esc(s.pagina):'')+'.':''}</p>
 ${s.nota_equipa?`<div class="notaeq"><b>Nota da equipa:</b> ${esc(s.nota_equipa)}</div>`:''}
 ${s.estado==='recebido'||s.estado==='alteracoes'?`<button class="btn sm" data-red="${esc(s.id)}" style="margin-top:12px">Corrigir</button>`:''}</div>`}).join('')||'<p class="note">Ainda não enviaste nenhum artigo deste aparelho.</p>'}
 <p class="note">Os teus artigos ficam ligados a este telemóvel ou computador. Podes corrigi-los enquanto a equipa não os aceitar.</p>`;
 rMsg='';
 rp.onclick=async ev=>{const b=ev.target.closest('[data-red]');if(!b)return;const s=lista.find(x=>x.id===b.dataset.red);if(!s)return;b.disabled=true;
  let urls={};try{urls=await db.urlsFotos((s.fotos||[]).map(x=>x.path))}catch(e){console.warn(e)}
  const p=s.pergunta||{};
  rForm={id:s.id,nota_equipa:s.nota_equipa,seccao:s.seccao||'',titulo:s.titulo||'',entrada:s.entrada||'',texto:s.texto||'',autores:s.autores||'',turma:s.turma||'',creditos_fotos:s.creditos_fotos||'',notas:s.notas||'',autorizacao:!!s.autorizacao,pt:p.t||'',pq:p.q||'',po:(p.o||[]).map((o,i)=>(p.t==='quiz'&&i===p.c?'*':'')+o).join('\n'),fotos:(s.fotos||[]).map(x=>Object.assign({},x,{url:urls[x.path]||''})),removidas:[]};
  rAba='novo';redacao()};
}

/* --- Painel: Redação (rever artigos e fechar a edição) --- */
let rFiltro='tratar',rAberto=null;
const FILTROS={tratar:['Por tratar',s=>s.estado==='recebido'||s.estado==='revisao'],alteracoes:['À espera do autor',s=>s.estado==='alteracoes'],aceite:['Aceites',s=>s.estado==='aceite'],publicado:['Publicados',s=>s.estado==='publicado'],recusado:['Recusados',s=>s.estado==='recusado'],todos:['Todos',()=>true]};
function detalhe(s,urls){
 const fs=s.fotos||[],p=s.pergunta;
 return `<div class="art">
 ${s.entrada?`<p style="margin-top:0"><b>${esc(s.entrada)}</b></p>`:''}
 <div class="texto">${esc(s.texto)}</div>
 ${fs.length?`<h3 style="margin-top:16px">Fotografias${s.creditos_fotos?` <span class="note">· ${esc(s.creditos_fotos)}</span>`:''}</h3>
 <div class="thumbs">${fs.map((f,i)=>`<div class="th">${urls[f.path]?`<img src="${esc(urls[f.path])}" alt="Foto ${i+1}">`:'<div class="ph">sem pré-visualização</div>'}<b>Foto ${i+1}</b>${f.legenda?`<span class="ls">${esc(f.legenda)}</span>`:''}</div>`).join('')}</div>
 <p class="note">${s.autorizacao?'O autor confirmou a autorização de imagem.':'<span class="err">O autor não confirmou a autorização de imagem.</span>'}</p>`:''}
 ${p&&Array.isArray(p.o)?`<p><b>Pergunta para os leitores (${p.t==='quiz'?'quiz':'votação'}):</b> ${esc(p.q)}<br><span class="note">${p.o.map((o,i)=>esc(o)+(p.t==='quiz'&&i===p.c?' ✓':'')).join(' · ')}</span></p>`:''}
 ${s.notas?`<div class="notaeq"><b>Recado do autor:</b> ${esc(s.notas)}</div>`:''}
 <div class="row" style="margin-top:14px"><div style="flex:1 1 200px"><label for="m-e">Estado</label><select id="m-e">${Object.entries(ESTADOS).map(([k,[l]])=>`<option value="${k}" ${s.estado===k?'selected':''}>${esc(l)}</option>`).join('')}</select></div>
 <div style="flex:0 1 110px"><label for="m-n">Edição N.º</label><input id="m-n" type="number" min="1" value="${esc(s.edicao??'')}"></div>
 <div style="flex:0 1 100px"><label for="m-p">Página</label><input id="m-p" maxlength="10" value="${esc(s.pagina||'')}"></div></div>
 <label for="m-x">Nota para o autor (aparece-lhe em "Os meus artigos")</label><textarea id="m-x" maxlength="800" style="min-height:64px" placeholder="ex.: Falta dizer quando foi a visita. Corta o 3.º parágrafo.">${esc(s.nota_equipa||'')}</textarea>
 <div class="row" style="margin-top:10px"><button class="btn pri sm" data-guardar="${esc(s.id)}" style="flex:0 0 auto">Guardar</button><button class="btn sm" data-copiar="${esc(s.id)}" style="flex:0 0 auto">Copiar texto</button>${fs.length?`<button class="btn sm" data-zip="${esc(s.id)}" style="flex:0 0 auto">Descarregar fotos (ZIP)</button>`:''}<button class="btn sm" data-apagar="${esc(s.id)}" style="flex:0 0 auto">${confirmar==='sub'+s.id?'Confirmar apagar?':'Apagar'}</button><span class="msg" id="m-msg"></span></div></div>`;
}
function edicaoDe(lista,n){
 const ex=edicao(n),ids=new Set();
 return {n,titulo:ex?ex.titulo:'',ano:ex?ex.ano:(eds.length?eds[eds.length-1].ano:''),artigos:lista.map(s=>{let id=slug(s.titulo),k=2;while(ids.has(id))id=slug(s.titulo)+'-'+k++;ids.add(id);
  const b=[{t:'reacoes'}],p=s.pergunta;if((s.fotos||[]).length)b.push({t:'fotos',n:s.fotos.length});
  if(p&&Array.isArray(p.o)&&(p.t==='sondagem'||p.t==='quiz'))b.push(p.t==='quiz'?{t:'quiz',q:p.q,o:p.o,c:p.c}:{t:'sondagem',q:p.q,o:p.o});
  b.push({t:'comentario',q:'Deixa uma mensagem aos autores'});
  return {id,p:s.pagina||'',s:s.seccao||'Notícias',ti:s.titulo,b}})};
}
async function pacote(lista,n,nome){
 if(!window.JSZip)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
 const z=new window.JSZip(),pad=x=>String(x).padStart(2,'0');
 let md=`# Repórter da Calheta n.º${n}\n\nArtigos aceites, por ordem de página.\n\n`;
 for(const s of lista){
  const pre=(s.pagina?'p'+pad(s.pagina)+'-':'')+slug(s.titulo),p=s.pergunta,fs=s.fotos||[];
  md+=`## ${s.pagina?'pág. '+s.pagina+' · ':''}${s.seccao||'Sem secção'} · ${s.titulo}\n\n${s.entrada?'**'+s.entrada+'**\n\n':''}${s.texto}\n\nTexto: ${s.autores}${s.turma?' ('+s.turma+')':''}\n`;
  if(fs.length){md+=`\nFotografias${s.creditos_fotos?' de '+s.creditos_fotos:''}:\n`;
   for(let i=0;i<fs.length;i++){const f=fs[i],fn=`${pre}-foto${pad(i+1)}.${f.path.split('.').pop()}`;md+=`- Foto ${i+1}: ${fn}${f.legenda?' · '+f.legenda:''}\n`;const b=await db.blobFoto(f.path).catch(()=>null);if(b)z.file('fotos/'+fn,b)}}
  if(p&&Array.isArray(p.o))md+=`\nPergunta para os leitores (${p.t==='quiz'?'quiz':'votação'}): ${p.q}\nOpções: ${p.o.map((o,i)=>o+(p.t==='quiz'&&i===p.c?' (certa)':'')).join(' / ')}\n`;
  if(s.notas)md+=`\nRecado do autor: ${s.notas}\n`;
  md+='\n---\n\n';
 }
 z.file('artigos.md',md);
 z.file('participa.json',JSON.stringify(edicaoDe(lista,n),null,1));
 await baixar(await z.generateAsync({type:'blob'}),nome);
}
async function pRedacao(){
 const [lista,info,cod]=await Promise.all([db.subs().catch(e=>{console.warn(e);return []}),db.redacaoInfo().catch(()=>({})),db.codigoRedacao().catch(()=>'')]);
 const proxN=Number(info.edicao)||(eds.reduce((m,e)=>Math.max(m,e.n),0)+1);
 const vis=lista.filter(FILTROS[rFiltro][1]),ab=vis.find(s=>s.id===rAberto);
 const urls=ab&&(ab.fotos||[]).length?await db.urlsFotos(ab.fotos.map(f=>f.path)).catch(()=>({})):{};
 const dt=s=>esc(new Date(s.criado).toLocaleDateString('pt-PT',{day:'numeric',month:'short'}));
 pane().innerHTML=`
 <div class="card"><h3>Receção de artigos</h3><form id="rcfg">
  <div class="row"><div style="flex:0 1 120px"><label for="ri-n">Próxima edição</label><input id="ri-n" type="number" min="1" value="${esc(proxN)}"></div>
  <div style="flex:0 1 190px"><label for="ri-p">Prazo de entrega</label><input id="ri-p" type="date" value="${esc(info.prazo||'')}"></div>
  <div><label for="ri-c">Código da redação</label><input id="ri-c" value="${esc(cod)}" autocomplete="off"></div></div>
  <label for="ri-m">Recado para os jornalistas (opcional)</label><input id="ri-m" maxlength="200" value="${esc(info.msg||'')}" placeholder="ex.: Procuramos reportagens sobre o Natal na escola">
  <label class="chk"><input type="checkbox" id="ri-a" ${info.aberta!==false?'checked':''}> Receção aberta (desliga quando o jornal já está a ser montado)</label>
  <div class="row" style="margin-top:12px"><button class="btn pri sm" style="flex:0 0 auto">Guardar</button><button type="button" class="btn sm" id="ri-l" style="flex:0 0 auto">Copiar ligação</button><button type="button" class="btn sm" id="ri-q" style="flex:0 0 auto">QR da redação (PNG)</button><button type="button" class="btn sm" id="ri-r" style="flex:0 0 auto">${confirmar==='revogar'?'Confirmar: tirar o acesso?':'Tirar o acesso a todos'}</button><span class="msg" id="ri-msg"></span></div>
 </form><p class="note">Os jornalistas abrem <b>${esc(urlRedacao())}</b> e entram com o código. Quem já entrou mantém o acesso mesmo que mudes o código; no fim do ano letivo, usa "Tirar o acesso a todos".</p></div>
 <div class="tabs" style="margin-top:18px">${Object.entries(FILTROS).map(([k,[l,fn]])=>`<button class="btn sm ${rFiltro===k?'on':''}" data-filtro="${k}">${l}${k!=='todos'?' ('+lista.filter(fn).length+')':''}</button>`).join('')}</div>
 ${vis.map(s=>{const nf=(s.fotos||[]).length,o=s.id===rAberto;return `<div class="card"><div class="row" style="align-items:center"><div style="flex:3 1 260px"><span class="lt">${esc(s.titulo)}</span><span class="ls">${esc(s.seccao||'Sem secção')} · ${esc(s.autores)}${s.turma?' ('+esc(s.turma)+')':''} · ${palavras(s.texto)} palavras · ${nf} ${nf===1?'foto':'fotos'} · ${dt(s)}</span></div>

  ${o?detalhe(s,urls):''}</div>`}).join('')||`<p class="note">${rFiltro==='tratar'?'Não há artigos por tratar.':'Nada aqui.'}</p>`}
 <div class="card"><h3>Fechar a edição</h3>
  <div class="row" style="align-items:end"><div style="flex:0 1 120px"><label for="x-n">Edição N.º</label><input id="x-n" type="number" min="1" value="${esc(proxN)}"></div>
  <div style="flex:3 1 320px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm" id="x-zip">Descarregar pacote (ZIP)</button><button class="btn sm" id="x-ed">Criar edição na Participa</button><button class="btn sm" id="x-pub">Marcar aceites como publicados</button></div></div>
  <p class="note" id="x-msg">Junta os artigos <b>aceites</b> dessa edição, por ordem de página: os textos (artigos.md), as fotos com o nome da página e o índice para a Participa, já com as perguntas dos jornalistas. Podes dar o pacote ao Claude para montar a edição no Canva.</p></div>`;
 const msg=(id,t,ok)=>{const el=$(id);if(el){el.className='msg '+(ok?'ok':'err');el.textContent=t}};
 $('#rcfg').onsubmit=async ev=>{ev.preventDefault();const c=$('#ri-c').value.trim();
  if(c.length<6)return msg('#ri-msg','O código precisa de pelo menos 6 caracteres.');
  try{await db.setRedacaoInfo({edicao:Number($('#ri-n').value)||null,prazo:$('#ri-p').value||'',msg:$('#ri-m').value.trim(),aberta:$('#ri-a').checked});if(c!==cod)await db.setCodigoRedacao(c);msg('#ri-msg','Guardado.',1)}
  catch(e){console.warn(e);msg('#ri-msg','Não foi possível guardar.')}};
 $('#ri-l').onclick=async ev=>{try{await navigator.clipboard.writeText(urlRedacao());ev.target.textContent='Copiada!'}catch(e){ev.target.textContent=urlRedacao()}};
 $('#ri-q').onclick=async()=>{const src=qrImg(urlRedacao(),'Redação','Envia o teu artigo para o jornal');if(src)await baixar(d2b(src),'QR-redacao.png')};
 $('#ri-r').onclick=async()=>{if(confirmar!=='revogar'){confirmar='revogar';return pRedacao()}confirmar=null;let ok=true;try{await db.limparRedatores()}catch(e){console.warn(e);ok=false}await pRedacao();msg('#ri-msg',ok?'Feito: todos vão precisar do código para voltar a entrar.':'Não foi possível tirar o acesso.',ok)};
 const aceites=()=>{const n=Number($('#x-n').value);return [n,lista.filter(s=>s.estado==='aceite'&&Number(s.edicao)===n).sort((a,b)=>(parseInt(a.pagina)||999)-(parseInt(b.pagina)||999))]};
 const vazio=n=>msg('#x-msg',`Ainda não há artigos aceites para o n.º${n}. Abre cada artigo, escolhe "Aceite" e indica a edição e a página.`);
 $('#x-zip').onclick=async ev=>{const [n,l]=aceites();if(!l.length)return vazio(n);ev.target.disabled=true;msg('#x-msg','A preparar o pacote…',1);
  try{await pacote(l,n,'Reporter-n'+n+'-artigos.zip');msg('#x-msg',`Pacote com ${l.length} ${l.length===1?'artigo':'artigos'} pronto.`,1)}catch(e){console.warn(e);msg('#x-msg','Não foi possível criar o pacote.')}ev.target.disabled=false};
 $('#x-ed').onclick=()=>{const [n,l]=aceites();if(!l.length)return vazio(n);const novo=edicaoDe(l,n),ex=edicao(n);
  if(ex){rasc=JSON.parse(JSON.stringify(ex));const ids=new Set(rasc.artigos.map(a=>a.id));novo.artigos.forEach(a=>{if(!ids.has(a.id))rasc.artigos.push(a)});rasc.artigos.sort((a,b)=>(parseInt(a.p)||999)-(parseInt(b.p)||999))}
  else rasc=Object.assign(novo,{novo:true});
  aba='edicoes';painel()};
 $('#x-pub').onclick=async ev=>{const [n,l]=aceites();if(!l.length)return vazio(n);ev.target.disabled=true;
  try{for(const s of l)await db.editarSub(s.id,{estado:'publicado'});painel()}catch(e){console.warn(e);msg('#x-msg','Não foi possível atualizar.');ev.target.disabled=false}};
 pane().onclick=async ev=>{const b=ev.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.filtro){rFiltro=d.filtro;rAberto=null;confirmar=null;return pRedacao()}
  if(d.abrir){rAberto=rAberto===d.abrir?null:d.abrir;confirmar=null;return pRedacao()}
  const s=lista.find(x=>x.id===(d.guardar||d.copiar||d.zip||d.apagar));if(!s)return;
  if(d.guardar){b.disabled=true;try{await db.editarSub(s.id,{estado:$('#m-e').value,edicao:Number($('#m-n').value)||null,pagina:$('#m-p').value.trim()||null,nota_equipa:$('#m-x').value.trim()||null});painel()}catch(e){console.warn(e);msg('#m-msg','Não foi possível guardar.');b.disabled=false}}
  if(d.copiar){try{await navigator.clipboard.writeText(textoDe(s));b.textContent='Copiado!'}catch(e){b.textContent='Não deu para copiar'}}
  if(d.zip){b.disabled=true;try{await pacote([s],s.edicao||proxN,'fotos-'+slug(s.titulo)+'.zip')}catch(e){console.warn(e);msg('#m-msg','Não foi possível criar o ZIP.')}b.disabled=false}
  if(d.apagar){if(confirmar!=='sub'+s.id){confirmar='sub'+s.id;return pRedacao()}confirmar=null;rAberto=null;try{await db.apagarSub(s)}catch(e){console.warn(e)}painel()}
 };
}

window.addEventListener('hashchange',()=>{if(location.hash!=='#painel')main.classList.remove('wide')});
init();
}
</script>
</body>
</html>
