<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Repórter da Calheta · Participa</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffd84d">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Kalam:wght@700&family=Fredoka:wght@500;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* VOICE: o jornal da escola a responder ao leitor — próximo, alegre, organizado.
   IDEA: uma página do Repórter da Calheta que ganhou botões.
   PICTURE: o próprio artigo com as suas votações, reações e fotos numeradas.
   COLOUR and TYPE: papel branco, tinta preta, marcador amarelo, títulos azuis; Unifraktur no cabeçalho, Kalam nas etiquetas, Fredoka nos títulos.
   LAYOUT: coluna única de telemóvel para o aluno; painel largo para o professor. */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#121419);--paper:light-dark(#f6f5f1,#1b1e25);--ink:light-dark(#16181d,#ecebe6);--mute:light-dark(#5b5f6d,#a5a9b5);--line:light-dark(#dcdad2,#30343e);--blue:light-dark(#1f5fbf,#8ab6ff);--hl:#ffd84d;--hls:light-dark(#fff1b3,#4a4120);--red:#e0394a;--ok:light-dark(#1d7a46,#72d59d);--bad:light-dark(#b3261e,#ff8a80)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Source Sans 3",system-ui,sans-serif;overflow-x:clip}
a{color:var(--blue)}
.wrap{max-width:calc(760px + 2*max(4vw,16px));margin:0 auto;padding:28px max(4vw,16px) 64px}
.wrap.wide{max-width:1180px}
header.mast{text-align:center;padding:18px max(4vw,16px) 0}
.mast h1{font:400 clamp(40px,9vw,68px)/1 "UnifrakturMaguntia",serif;margin:0;letter-spacing:.5px}
.mast h1 a{color:inherit;text-decoration:none}
.mast .sub{font-size:14px;color:var(--mute);margin:4px 0 10px}
.rule{border-top:2px solid var(--ink);border-bottom:1px solid var(--ink);height:5px;max-width:760px;margin:0 auto}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;max-width:760px;margin:8px auto 0;font-size:14px;font-weight:600}
.tag{display:inline-block;background:var(--hl);color:#16181d;font:700 17px/1.2 "Kalam",cursive;padding:3px 10px 1px;transform:rotate(-1.5deg);border-radius:3px}
h2.t{font:600 clamp(28px,6vw,40px)/1.08 "Fredoka",sans-serif;color:var(--blue);margin:14px 0 6px;text-wrap:balance}
h3{font:600 20px/1.2 "Fredoka",sans-serif;margin:0 0 10px}
.lead{color:var(--mute);margin:0 0 18px}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}
.btn{font:600 16px "Source Sans 3",sans-serif;min-height:44px;padding:8px 18px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.sm{min-height:36px;padding:4px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.opts{display:grid;gap:8px}
.opt{position:relative;overflow:hidden;text-align:left;min-height:48px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:600 16px "Source Sans 3",sans-serif;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
.opt .bar{position:absolute;inset:0 auto 0 0;background:var(--hls);z-index:0;transition:width .5s ease}
.opt span{position:relative;z-index:1}
.opt.mine{border-color:var(--ink)}
.opt.right{border-color:var(--ok)}.opt.wrong{border-color:var(--bad)}
.pct{font-variant-numeric:tabular-nums;white-space:nowrap}
.react{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.react button{min-height:72px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font:600 14px "Source Sans 3",sans-serif;display:grid;place-items:center;gap:0;padding:6px}
.react button b{font-size:28px;line-height:1}
.react button.mine{border-color:var(--ink);background:var(--hls)}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.fotos button{aspect-ratio:1;border-radius:10px;border:1.5px dashed var(--line);background:var(--bg);color:var(--ink);cursor:pointer;display:grid;place-content:center;gap:2px;font:600 15px "Source Sans 3",sans-serif}
.fotos button i{font-style:normal;color:var(--mute);font-size:14px}
.fotos button.mine{border:1.5px solid var(--red)}.fotos button.mine i{color:var(--red)}
.stars{display:flex;gap:4px}
.stars button{width:48px;height:48px;font-size:32px;line-height:1;border:0;background:none;color:var(--line);cursor:pointer;padding:0}
.stars button.on{color:#f2b705}
.note{font-size:14px;color:var(--mute);margin:8px 0 0}
label{display:block;font-weight:600;font-size:15px;margin:10px 0 4px}
input,select,textarea{width:100%;font:16px "Source Sans 3",sans-serif;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:96px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>*{flex:1 1 150px}
.coms{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px}
.coms li{background:var(--bg);border-radius:10px;padding:10px 12px;border:1px solid var(--line)}
.coms small{color:var(--mute);font-weight:600}
.ok{color:var(--ok);font-weight:600}.err{color:var(--bad);font-weight:600}
.list{list-style:none;margin:0;padding:0}
.list li a{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.list li a:hover .lt{color:var(--blue)}
.pg{font:700 15px "Kalam",cursive;color:var(--mute)}
.lt{font-weight:700;line-height:1.25}.ls{display:block;font-size:14px;color:var(--mute);font-weight:400}
.n{font-size:14px;color:var(--mute);white-space:nowrap}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;border-bottom:1.5px solid var(--line);margin-bottom:14px}
.tabs .btn{flex:none;border-color:var(--line)}.tabs .btn.on{border-color:var(--ink);background:var(--hls)}
.badge{background:var(--red);color:#fff;border-radius:999px;padding:0 7px;font-size:13px;margin-left:4px}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.qrgrid .card{margin:0;text-align:center}.qrgrid img{width:100%;max-width:220px;background:#fff;border-radius:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:14px;display:flex;gap:6px;align-items:center}
.chip button{border:0;background:none;color:var(--mute);font-size:18px;cursor:pointer;width:28px;height:28px}
.art{border-top:1.5px solid var(--line);padding-top:12px;margin-top:12px}
.flag{background:var(--hls);border-radius:6px;padding:0 6px;font-size:13px;font-weight:700}
.res .opt{cursor:default;min-height:38px;padding:6px 12px;font-size:15px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.th{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:6px;align-content:start}
.th img,.th .ph{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;background:var(--paper)}
.th .ph{display:grid;place-items:center;color:var(--mute);font-size:13px}
.th input{padding:6px 8px;font-size:15px}
.thb{display:flex;gap:6px;align-items:center}.thb b{flex:1 1 auto}.thb .btn{min-height:34px;min-width:34px;padding:0 8px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin-top:14px}
.chk input{width:22px;height:22px;flex:none;margin:2px 0 0}
.texto{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;max-height:520px;overflow:auto}
.notaeq{background:var(--hls);border-radius:10px;padding:10px 12px;margin-top:10px}
.est{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;border:1.5px solid var(--line);white-space:nowrap}
.est-recebido,.est-revisao{border-color:var(--blue);color:var(--blue)}.est-alteracoes{border-color:var(--hl);background:var(--hls)}.est-aceite,.est-publicado{border-color:var(--ok);color:var(--ok)}.est-recusado{border-color:var(--bad);color:var(--bad)}
.ver{display:inline-block;font-size:12px;font-weight:700;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:0 7px;margin-left:2px;vertical-align:1px}
.lk{border:0;background:none;color:var(--blue);text-decoration:underline;cursor:pointer;font:inherit;padding:0}
.turma{margin-top:18px}
.txt{white-space:pre-wrap}
.atalhos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:16px 0 20px}
.atalhos a,.atalhos .at{display:block;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;color:var(--ink);text-decoration:none;background:var(--paper)}
.atalhos a:hover{border-color:var(--ink)}
.atalhos b{display:block;font:600 18px "Fredoka",sans-serif;color:var(--blue)}
.atalhos span{font-size:14px;color:var(--mute)}
.chk-list{list-style:none;padding:0;margin:0;display:grid;gap:4px}.chk-list li.ok{color:var(--ok)}.chk-list li.av{font-weight:600}
.pistas{list-style:none;padding:0;margin:0;display:grid;gap:4px;color:var(--mute)}.pistas li.ok{color:var(--ok);font-weight:600}
.pdfv{background:var(--paper);border-radius:12px;padding:10px;outline-offset:2px}.pdfv canvas{display:block;width:100%;background:#fff;border-radius:6px}
.pdfbar{display:flex;gap:12px;align-items:center;justify-content:center;margin-bottom:8px;font-weight:600}
a.chip{text-decoration:none;color:var(--ink);padding:6px 12px}
.plano{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:14px}
.pag{border:1.5px dashed var(--line);border-radius:10px;padding:8px;min-height:110px;background:var(--bg)}
.pag.solta{min-height:60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;border:0;padding:0;background:none}
.pag.usada{border-style:solid}.pag.cheia{border-color:var(--bad)}.pag.sobre{outline:3px solid var(--blue)}
.pagh{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;color:var(--mute)}.pagh b{color:var(--ink)}
.pl-a{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-bottom:6px;cursor:grab;font-size:15px}
.pl-a .lt{display:block;line-height:1.2}.pl-a select{margin-top:6px;padding:4px 6px;font-size:14px}
.cartao img{display:block;width:100%;max-width:560px;border-radius:14px;box-shadow:0 2px 14px rgba(0,0,0,.18);background:#fff}
.guia details{border-top:1px solid var(--line);padding:10px 0}.guia details:first-child{border-top:0}
.guia summary{font:600 19px "Fredoka",sans-serif;cursor:pointer;min-height:32px}
.guia .ex{background:var(--bg);border-left:4px solid var(--hl);padding:10px 12px;border-radius:6px;white-space:pre-wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0}
.kpi{background:var(--paper);border-radius:12px;padding:12px;font-size:15px;color:var(--mute)}.kpi b{display:block;font:600 32px "Fredoka",sans-serif;color:var(--blue)}
table.t{width:100%;border-collapse:collapse;font-size:15px}table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}table.t .nu{text-align:right;font-variant-numeric:tabular-nums}
body.tvmode header.mast{display:none}body.tvmode .wrap{max-width:none;padding:0}
.tv{min-height:100vh;display:grid;place-items:center;padding:4vw}
.tvs{width:min(1400px,100%);font-size:clamp(20px,2.2vw,38px)}
.tvs .tvk{font:400 clamp(28px,3.4vw,60px)/1 "UnifrakturMaguntia",serif;margin:0 0 1.2vw}
.tvs h2{font:600 clamp(40px,5vw,88px)/1.05 "Fredoka",sans-serif;color:var(--blue);margin:0 0 3vw;text-wrap:balance}
.tvs .opt{min-height:auto;font-size:inherit;padding:.45em .8em}
.tvqr{display:grid;grid-template-columns:auto 1fr;gap:4vw;align-items:center}.tvqr img{width:min(34vw,500px);background:#fff;border-radius:12px}
@media(max-width:600px){.tvqr{grid-template-columns:1fr}}

/* v1.3 */
.login{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:clamp(24px,5vw,56px);align-items:start;max-width:960px;margin:20px auto 0}
.login-card{margin:0;padding:clamp(20px,4vw,30px);background:var(--bg);border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink)}
.login-t{font-size:clamp(28px,5vw,36px);margin:14px 0 4px}
.pwbox{position:relative}.pwbox input{padding-right:96px}
.pwv{position:absolute;right:6px;top:50%;transform:translateY(-50%);min-height:36px;padding:0 10px;border:0;border-radius:8px;background:none;color:var(--blue);font:600 15px "Source Sans 3",sans-serif;cursor:pointer}
.btn.full{width:100%;margin-top:18px}.caps{margin:6px 0 0;color:var(--bad)}
.login-aside{padding-top:8px}.login-aside h3{font-size:22px}
.login-aside ul{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:12px}
.login-aside li{position:relative;padding-left:30px;line-height:1.4}.login-aside li::before{content:"✓";position:absolute;left:0;top:-1px;width:22px;height:22px;border-radius:50%;background:var(--hl);color:#16181d;font:700 14px/22px "Source Sans 3",sans-serif;text-align:center}
@media(max-width:780px){.login{grid-template-columns:1fr}.login-aside{order:2}}

.list li a.lido .lt{color:var(--mute)}.vist{color:var(--ok);font-weight:700}
.passa-h{display:flex;gap:14px;align-items:center}.selo0{width:64px;height:64px;border-radius:50%;border:3px dashed var(--line);display:grid;place-items:center;font:600 26px "Fredoka",sans-serif;color:var(--mute);flex:none}
.carimbos{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}.carimbos span{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line)}.carimbos span.on{background:var(--hl);border-color:var(--ink)}
.ouvir{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px}.ouvir .vel{display:flex;gap:6px;align-items:center;margin:0;font-size:14px;font-weight:400}.ouvir select{width:auto;padding:4px 8px;font-size:14px}
details>summary{cursor:pointer}
.accb{min-height:28px;padding:0 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:600 13px "Source Sans 3",sans-serif;cursor:pointer;margin:-4px 0}.accb b{font-family:"Fredoka",sans-serif;font-size:14px}.accb:hover{border-color:var(--ink)}
.meta{align-items:center}
.accp{position:fixed;top:12px;right:10px;z-index:51;width:min(340px,calc(100vw - 20px));margin:0;box-shadow:0 6px 30px rgba(0,0,0,.25);background:var(--bg)}
.accp .lbl{margin:10px 0 4px;font-weight:600;font-size:15px}.seg{display:flex;gap:6px;flex-wrap:wrap}.seg .btn.on{background:var(--hls);border-color:var(--ink)}
body.tvmode .accb{display:none}
html[data-fs="2"] .wrap,html[data-fs="2"] header.mast{zoom:1.15}html[data-fs="3"] .wrap,html[data-fs="3"] header.mast{zoom:1.32}
html[data-font=leg] :is(body,h2,h3,h4,.tag,.btn,.opt,input,select,textarea,button,.lt,.pg,.kpi b,.atalhos b){font-family:"Atkinson Hyperlegible",system-ui,sans-serif!important;letter-spacing:.01em;word-spacing:.08em}
html[data-font=leg] body{line-height:1.7}
html[data-contraste="1"]{--mute:var(--ink);--line:var(--ink);--paper:var(--bg);--blue:light-dark(#0b3d91,#c3dbff);--hls:light-dark(#ffe066,#5c4a00)}
html[data-contraste="1"] .card,html[data-contraste="1"] .opt{border-width:2px}
.sopa{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:2px;max-width:560px;user-select:none}
.sopa button{aspect-ratio:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 clamp(13px,3.6vw,20px) "Source Sans 3",sans-serif;padding:0;border-radius:4px;cursor:pointer}
.sopa button.ach{background:var(--hls);border-color:var(--ink)}.sopa button.sel{outline:3px solid var(--blue);outline-offset:-2px}
.pzw{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-wrap:wrap;gap:6px 14px;font-weight:600}.pzw li.ok{text-decoration:line-through;color:var(--ok)}
.cruz-w{overflow-x:auto}.cruz{display:grid;grid-template-columns:repeat(var(--c),40px);gap:0;width:max-content}
.cz{position:relative;width:40px;height:40px;margin:0;border:1px solid var(--ink);background:var(--bg)}.cz.x{border-color:transparent;background:none}
.cz i{position:absolute;top:1px;left:3px;font:600 11px "Source Sans 3",sans-serif;font-style:normal;color:var(--mute)}
.cz input{width:100%;height:100%;border:0;border-radius:0;padding:8px 0 0;text-align:center;text-transform:uppercase;font:600 20px "Source Sans 3",sans-serif;background:transparent}.cz input.mal{color:var(--bad);background:light-dark(#fde8e6,#3a1916)}
.pistas2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}.pistas2 h4{margin:0 0 4px;font:600 17px "Fredoka",sans-serif}.pistas2 ol{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.gf{margin:0;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.gf img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--bg)}.gf figcaption{padding:10px;display:grid;gap:6px}
.mapa{height:min(60vh,460px);border-radius:12px;border:1.5px solid var(--line);margin:14px 0;background:var(--paper)}.mapa .leaflet-popup-content a{color:#1f5fbf}
.agenda{list-style:none;padding:0;margin:0}.ev{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.evd{text-align:center;border:1.5px solid var(--ink);border-radius:10px;padding:4px 0;line-height:1.1}.evd b{display:block;font:600 22px "Fredoka",sans-serif}.evd span{font-size:13px;color:var(--mute);text-transform:uppercase}

@media(max-width:600px){.ev{grid-template-columns:48px 1fr}.ev .btn{grid-column:2}}
.rvl{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:10px}.rvl li{border-left:4px solid var(--hl);padding:4px 0 4px 10px}.rvl mark,mark.an{background:var(--hls);color:inherit;border-bottom:2px solid #e0a800}
.ctx{font-size:15px}mark.an sup{font-weight:700;color:var(--blue);padding-left:2px}
.anl{margin:10px 0 0;padding-left:22px;display:grid;gap:4px}.anl li.feita{color:var(--mute)}
.diff ins{background:light-dark(#d5f5df,#163a22);text-decoration:none}.diff del{background:light-dark(#fde2df,#40181a);color:var(--bad)}
p.note ins{background:light-dark(#d5f5df,#163a22);text-decoration:none}p.note del{background:light-dark(#fde2df,#40181a)}
.hb{position:relative;height:22px;background:var(--bg);border-radius:4px;overflow:hidden}.hb span{position:absolute;inset:0 auto 0 0;background:var(--hls);border-right:2px solid var(--ink)}.hb b{position:relative;padding-left:6px;font-size:14px;font-variant-numeric:tabular-nums}
.horas{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;height:140px;align-items:end;padding-bottom:18px;position:relative}.horas.dias{grid-template-columns:repeat(auto-fit,minmax(6px,1fr));padding-bottom:0;height:100px}
.horas div{height:100%;display:flex;flex-direction:column;justify-content:flex-end;position:relative}.horas span{display:block;background:var(--blue);border-radius:4px 4px 0 0;min-height:2px}.horas i{position:absolute;bottom:-18px;left:0;font-size:12px;font-style:normal;color:var(--mute)}
.avisos{margin-top:4px}

/* ======== Fotos da redação no modo demonstração (IndexedDB) ======== */
const idb={h:null,mem:new Map(),
 async open(){if(this.h===null)this.h=await new Promise(ok=>{try{const r=indexedDB.open('rc-fotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(false)}catch(e){ok(false)}});return this.h},
 async put(k,v){const d=await this.open();if(!d){this.mem.set(k,v);return}await new Promise(ok=>{try{const t=d.transaction('f','readwrite');t.objectStore('f').put(v,k);t.oncomplete=ok;t.onerror=()=>{this.mem.set(k,v);ok()}}catch(e){this.mem.set(k,v);ok()}})},
 async get(k){if(this.mem.has(k))return this.mem.get(k);const d=await this.open();if(!d)return null;return new Promise(ok=>{try{const r=d.transaction('f').objectStore('f').get(k);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>ok(null)}catch(e){ok(null)}})},
 async del(k){this.mem.delete(k);const d=await this.open();if(d)await new Promise(ok=>{try{const t=d.transaction('f','readwrite');t.objectStore('f').delete(k);t.oncomplete=ok;t.onerror=ok}catch(e){ok()}})}

/* ======== Base de dados: Supabase (online, partilhada) ======== */
function supa(cl){
 const chk=r=>{if(r.error)throw r.error;return r.data};
 return {
  cl,
  async edicoes(){return chk(await cl.from('edicoes').select('dados').order('numero')).map(r=>r.dados)},
  async destaque(){const d=chk(await cl.from('definicoes').select('valor').eq('chave','destaque').maybeSingle());return d?Number(d.valor):null},
  async setDestaque(n){chk(await cl.from('definicoes').upsert({chave:'destaque',valor:String(n)}))},
  async guardarEdicao(e){chk(await cl.from('edicoes').upsert({numero:e.n,dados:e}))},
  async apagarEdicao(n){chk(await cl.from('edicoes').delete().eq('numero',n))},
  async todasContagens(ed){const out={};chk(await cl.rpc('contagens_edicao',{p_edicao:ed})).forEach(r=>{const a=out[r.artigo]=out[r.artigo]||{};(a[r.chave]=a[r.chave]||{})[r.opcao]=Number(r.total)});return out},
  async contagens(ed,art){return (await this.todasContagens(ed))[art]||{}},
  async meus(ed,art){const out={};chk(await cl.from('votos').select('chave,opcao').eq('edicao',ed).eq('artigo',art)).forEach(r=>out[r.chave]=r.opcao);return out},
  async votar(ed,art,ch,op){if(op==null)chk(await cl.from('votos').delete().match({edicao:ed,artigo:art,chave:ch}));else chk(await cl.from('votos').upsert({edicao:ed,artigo:art,chave:ch,opcao:op},{onConflict:'edicao,artigo,chave,utilizador'}))},
  async comentar(c){chk(await cl.from('comentarios').insert({edicao:c.ed,artigo:c.art,tipo:c.tipo,nome:c.nome,turma:c.turma,texto:c.texto}))},
  async comentarios(f){let q=cl.from('comentarios').select('*').order('criado',{ascending:false});if(f.ed)q=q.eq('edicao',f.ed);if(f.art)q=q.eq('artigo',f.art);if(f.estado)q=q.eq('estado',f.estado);if(f.tipo)q=q.eq('tipo',f.tipo);return chk(await q).map(r=>({id:r.id,ed:r.edicao,art:r.artigo,tipo:r.tipo,nome:r.nome,turma:r.turma,texto:r.texto,estado:r.estado,criado:r.criado}))},
  async moderar(id,estado){chk(await cl.from('comentarios').update({estado}).eq('id',id))},
  async uid(){const {data}=await cl.auth.getSession();return data.session?.user?.id},
  async eRedator(){return !!chk(await cl.rpc('e_redator'))},
  async entrarRedacao(c){return !!chk(await cl.rpc('entrar_redacao',{p_codigo:String(c)}))},
  async redacaoInfo(){const d=chk(await cl.from('definicoes').select('valor').eq('chave','redacao').maybeSingle());try{return d?JSON.parse(d.valor):{}}catch(e){return {}}},
  async setRedacaoInfo(o){chk(await cl.from('definicoes').upsert({chave:'redacao',valor:JSON.stringify(o)}))},
  async codigoRedacao(){return chk(await cl.rpc('ver_codigo_redacao'))||''},
  async setCodigoRedacao(c){chk(await cl.rpc('definir_codigo_redacao',{p_codigo:c}))},
  async limparRedatores(){chk(await cl.rpc('limpar_redatores'))},
  async submeter(s){return chk(await cl.from('submissoes').insert(s).select('id').single()).id},
  async editarSub(id,s){chk(await cl.from('submissoes').update(s).eq('id',id))},
  async minhas(){const u=await this.uid();return chk(await cl.from('submissoes').select('*').eq('autor',u).order('criado',{ascending:false}))},
  async subs(){return chk(await cl.from('submissoes').select('*').order('criado',{ascending:false}))},
  async apagarSub(s){const p=(s.fotos||[]).map(f=>f.path);if(p.length)await cl.storage.from('submissoes').remove(p);chk(await cl.from('submissoes').delete().eq('id',s.id))},
  async subirFoto(b,ext){const path=(await this.uid())+'/'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)+'.'+ext;chk(await cl.storage.from('submissoes').upload(path,b,{contentType:b.type||'image/jpeg'}));return path},
  async urlsFotos(paths){const o={};if(!paths.length)return o;chk(await cl.storage.from('submissoes').createSignedUrls(paths,3600)).forEach(x=>{if(x.signedUrl)o[x.path]=x.signedUrl});return o},
  async blobFoto(p){return chk(await cl.storage.from('submissoes').download(p))},
  async apagarFotos(paths){if(paths.length)chk(await cl.storage.from('submissoes').remove(paths))}
 };
}

const soma=o=>Object.values(o||{}).reduce((x,y)=>x+y,0);

 if(b.t==='fotos'){let h='';for(let k=1;k<=b.n;k++){const kk=bi+':'+k,on=meus[kk]!=null,n=soma(cont[kk]);h+=`<button data-act="foto" data-ch="${kk}" class="${on?'mine':''}" aria-pressed="${on}" aria-label="Gosto na foto ${k}">Foto ${k}<i>${on?'♥':'♡'} ${n}</i></button>`}

 if(b.t==='sondagem'||b.t==='quiz'){

   let cls=mine===k?'mine':'';if(quiz&&done){if(oi===b.c)cls+=' right';else if(mine===k)cls+=' wrong'}
   return `<button class="opt ${cls}" data-act="vote" data-ch="${ch}" data-op="${k}" ${quiz&&done?'disabled':''}>${show?`<span class="bar" style="width:${p}%"></span>`:''}<span>${esc(o)}${quiz&&done&&oi===b.c?' ✓':''}</span>${show?`<span class="pct">${p}%</span>`:''}</button>`}).join('');
  const fim=quiz?(done?(Number(mine)===b.c?'<p class="ok">Certo! Bem lido.</p>':'<p class="err">Não é bem isso. A resposta certa está assinalada.</p>'):'<p class="note">Escolhe uma resposta. Só tens uma tentativa!</p>'):(done?`<p class="note">${tot} ${tot===1?'voto':'votos'}. Podes mudar o teu voto.</p>`:'<p class="note">Vota para veres os resultados.</p>');

 if(b.t==='comentario'||b.t==='sugestao'){const sug=b.t==='sugestao';
  return `<div class="card"><h3>${esc(b.q||(sug?'Tens uma sugestão?':'Deixa a tua opinião'))}</h3>

  <div class="row" style="margin-top:10px"><button class="btn pri" style="flex:0 0 auto">Enviar</button><span class="msg"></span></div>
  <p class="note">${sug?'Só a equipa do jornal lê as sugestões.':'Os comentários aparecem depois de um professor os aprovar.'} Não escrevas apelidos, moradas, telefones nem nada sobre outras pessoas.</p></form>
  ${sug?'':`<ul class="coms">${coms.length?coms.map(x=>`<li><small>${esc(x.nome||'Anónimo')}${x.turma?' · '+esc(x.turma):''}</small><br>${esc(x.texto)}</li>`).join(''):'<li class="note">Ainda não há comentários aprovados. Sê o primeiro!</li>'}</ul>`}</div>`}

function parseImport(txt){
 txt=txt.trim();if(!txt)return [];
 if(txt[0]==='{'||txt[0]==='['){const j=JSON.parse(txt);return {json:j}}
 const usados=new Set();
 return txt.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split('|').map(x=>x.trim());
  let pag='',sec='',ti=l;if(p.length>=3){[pag,sec]=p;ti=p.slice(2).join(' ')}else if(p.length===2){[pag,ti]=p}
  let id=slug(ti),k=2;while(usados.has(id))id=slug(ti)+'-'+k++;usados.add(id);
  return {id,p:pag.replace(/\D/g,'')||pag,s:sec||'Notícias',ti,b:[{t:'reacoes'},{t:'comentario',q:'Deixa a tua opinião'}]}});
}

  <div class="chips">${a.b.map((b,j)=>`<span class="chip"><b>${TIPOS[b.t]}</b>${b.t==='fotos'?' · '+b.n+' fotos':b.q?' · '+esc(b.q.slice(0,50)):''}<button data-rmb="${i}:${j}" aria-label="Remover">×</button></span>`).join('')}</div>
  <div class="row"><select data-nt="${i}" style="flex:0 1 190px">${Object.entries(TIPOS).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select><input data-nq="${i}" placeholder="Pergunta (ou nº de fotos)" style="flex:2 1 200px"><input data-no="${i}" placeholder="Opções separadas por vírgula; no quiz, * na certa" style="flex:2 1 220px"><button class="btn sm" data-add="${i}" style="flex:0 0 auto">+ Bloco</button></div></div>`).join('')}</div>
 <div class="row" style="margin-top:18px"><button class="btn pri" id="guardar" style="flex:0 0 auto">${confirmar==='sobre'?'Substituir a edição existente?':'Guardar edição'}</button><button class="btn" id="cancelar" style="flex:0 0 auto">Cancelar</button><span class="msg" id="gMsg"></span></div>`;
 const sync=()=>{r.n=Number($('#en').value)||r.n;r.titulo=$('#et').value.trim();r.ano=$('#ea').value.trim();pane().querySelectorAll('[data-f]').forEach(x=>{r.artigos[x.dataset.i][x.dataset.f]=x.value.trim()})};
 bindExtras(r,sync);
 pane().querySelectorAll('[data-nt]').forEach(sl=>sl.onchange=()=>{const i=sl.dataset.nt,q=pane().querySelector(`[data-nq="${i}"]`),o=pane().querySelector(`[data-no="${i}"]`),P={sopa:['Título (ex.: Sopa de letras do Natal)','Palavras separadas por vírgula'],cruzadas:['Título (ex.: Cruzadas do ambiente)','PALAVRA=pista; PALAVRA=pista; …'],texto:['Título (ex.: In English)','O texto'],fotos:['Número de fotos','']}[sl.value]||['Pergunta (ou nº de fotos)','Opções separadas por vírgula; no quiz, * na certa'];q.placeholder=P[0];o.placeholder=P[1]});
 $('#lerImp').onclick=()=>{sync();const m=$('#impMsg');try{const res=parseImport($('#imp').value);
   if(res.json){const j=res.json,arts=Array.isArray(j)?j:j.artigos;if(!Array.isArray(arts))throw new Error('sem artigos');
    if(!Array.isArray(j)){if(j.n)r.n=Number(j.n);if(j.titulo)r.titulo=j.titulo;if(j.ano)r.ano=j.ano}
    arts.forEach(a=>r.artigos.push(Object.assign({id:slug(a.id||a.ti),p:a.p??'',s:a.s||'',ti:String(a.ti||''),b:Array.isArray(a.b)?a.b.filter(b=>TIPOS[b.t]):[]},...['r','au','tx','lg'].filter(k=>a[k]).map(k=>({[k]:String(a[k])})))))}
   else r.artigos.push(...res);
   editor();$('#impMsg').className='msg ok';$('#impMsg').textContent='Artigos acrescentados. Ajusta os blocos de cada um.'}
  catch(e){m.className='msg err';m.textContent='Não percebi o texto colado. Verifica o formato.'}};
 pane().onclick=ev=>{const b=ev.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.rm){sync();r.artigos.splice(Number(d.rm),1);editor()}
  if(d.rmb){sync();const[i,j]=d.rmb.split(':').map(Number);r.artigos[i].b.splice(j,1);editor()}
  if(d.add){sync();const i=Number(d.add),t=pane().querySelector(`[data-nt="${i}"]`).value,q=pane().querySelector(`[data-nq="${i}"]`).value.trim(),os=pane().querySelector(`[data-no="${i}"]`).value.split(',').map(x=>x.trim()).filter(Boolean);
   let nb={t};
   if(t==='fotos')nb.n=Math.max(1,Math.min(40,parseInt(q)||6));
   else if(t==='sondagem'||t==='quiz'){if(!q||os.length<2){b.textContent='Falta pergunta ou opções';return}nb.q=q;nb.c=Math.max(0,os.findIndex(o=>o.startsWith('*')));nb.o=os.map(o=>o.replace(/^\*/,'').trim());if(t==='sondagem')delete nb.c}
   else if(t==='texto'){const raw=pane().querySelector(`[data-no="${i}"]`).value.trim();if(!raw){b.textContent='Escreve o texto em Opções';return}nb.q=q||'In English';nb.x=raw}
   else if(t==='audio'){escolherAudio(i,q);return}
   else if(t==='sopa'){const raw=pane().querySelector(`[data-no="${i}"]`).value.split(/[,;\n]/).map(x=>x.trim()).filter(Boolean);if(raw.length<3){b.textContent='Escreve pelo menos 3 palavras';return}const z=gerarSopa(raw,r.n+'-'+r.artigos[i].ti+'-'+Date.now());nb.q=q||'Sopa de letras';nb.g=z.g;nb.w=z.w;if(z.w.length<raw.length)alertaEd(`${raw.length-z.w.length} palavras não couberam (máximo 14 letras).`)}
   else if(t==='cruzadas'){const raw=pane().querySelector(`[data-no="${i}"]`).value.split(';').map(x=>x.split('=')).filter(x=>x[0]&&x[0].trim()&&x[1]).map(x=>({p:x[0].trim(),d:x.slice(1).join('=').trim()}));if(raw.length<3){b.textContent='Escreve pelo menos 3 palavras com pista';return}const z=gerarCruz(raw,r.n+'-'+r.artigos[i].ti+'-'+Date.now());if(!z){b.textContent='Não consegui cruzar as palavras';return}Object.assign(nb,{q:q||'Palavras cruzadas',R:z.R,C:z.C,w:z.w});if(z.fora)alertaEd(`${z.fora} ${z.fora===1?'palavra não cruzou':'palavras não cruzaram'} com as outras e ficaram de fora. Experimenta palavras com letras em comum.`)}
   else if(t!=='reacoes')nb.q=q||({estrelas:'Que nota dás?',comentario:'Deixa a tua opinião',sugestao:'Tens uma sugestão?',perguntas:'Que pergunta gostavas de fazer?'})[t];
   r.artigos[i].b.push(nb);editor()}};
 $('#cancelar').onclick=()=>{rasc=null;confirmar=null;painel()};
 $('#guardar').onclick=async()=>{sync();const m=$('#gMsg');
  if(!r.artigos.length){m.className='msg err';m.textContent='A edição não tem artigos.';return}
  const ids=new Set();r.artigos.forEach(a=>{a.id=slug(a.id||a.ti);let id=a.id,k=2;while(ids.has(id))id=a.id+'-'+k++;a.id=id;ids.add(id)});
  if(r.novo&&edicao(r.n)&&confirmar!=='sobre'){confirmar='sobre';editor();$('#gMsg').className='msg err';$('#gMsg').textContent='Já existe uma edição N.º'+r.n+'. Clica outra vez para substituir.';return}
  const e={n:r.n,titulo:r.titulo,ano:r.ano,artigos:r.artigos,capa:(r.capa&&r.capa.q&&(r.capa.o||[]).length>=2)?r.capa:null,caca:(r.caca||[]).filter(p=>p.q&&(p.o||[]).length>=2),pdf:r.pdf||''};
  try{await db.guardarEdicao(e);if(r.novo){await db.setDestaque(e.n);dest=e.n}await carregar();rasc=null;confirmar=null;edSel=e.n;aba='qr';painel()}
  catch(err){console.warn(err);m.className='msg err';m.textContent='Não foi possível guardar.'}};
}

async function pModeracao(){
 const [lista,ret]=await Promise.all([db.comentarios(verTodos?{}:{estado:verRet?'retido':'pendente'}).catch(()=>[]),db.comentarios({estado:'retido'}).catch(()=>[])]);
 const tit=(n,id)=>{const a=edicao(n)?.artigos.find(x=>x.id===id);return a?`N.º${n} · pág. ${a.p} · ${a.ti}`:`N.º${n} · ${({_familias:'Mural das famílias',_capa:'Capa',_cartas:'Cartas ao jornal'})[id]||id}`};
 pane().innerHTML=`<div class="row" style="align-items:center"><h3 style="flex:1 1 auto;margin:0">${verTodos?'Todas as mensagens':verRet?'Retidas pelo filtro de linguagem':'À espera de aprovação'} (${lista.length})</h3><button class="btn sm" id="tog" style="flex:0 0 auto">${verTodos?'Ver só pendentes':'Ver todas'}</button>${!verTodos?`<button class="btn sm ${verRet?'on':''}" id="togr" style="flex:0 0 auto">${verRet?'Voltar às pendentes':'Retidas pelo filtro ('+ret.length+')'}</button>`:''}</div>${verRet?'<p class="note">Estas mensagens têm palavras da lista de linguagem imprópria e não entram na lista normal. Às vezes o filtro engana-se (por exemplo, "burro" num texto sobre animais): podes aprovar à mesma.</p>':''}
 ${lista.map(c=>{const mau=MAUS.some(w=>(c.texto+' '+c.nome).toLowerCase().includes(w));
  return `<div class="card"><p class="note" style="margin:0 0 6px">${esc(tit(c.ed,c.art))} · ${TIPOC[c.tipo]||c.tipo} · ${esc(new Date(c.criado).toLocaleString('pt-PT'))} ${mau||c.estado==='retido'?'<span class="flag">verificar linguagem</span>':''}</p>
  <b>${esc(c.nome||'Anónimo')}${c.turma?' · '+esc(c.turma):''}</b><p style="margin:4px 0 10px">${esc(c.texto)}</p>
  <div style="display:flex;gap:6px;flex-wrap:wrap">${c.estado!=='aprovado'?`<button class="btn sm pri" data-mod="${esc(c.id)}" data-e="aprovado">${c.tipo==='sugestao'||c.tipo==='pergunta'?'Marcar como lida':'Aprovar'}</button>`:'<span class="ok">Aprovado</span>'}${c.estado!=='rejeitado'?`<button class="btn sm" data-mod="${esc(c.id)}" data-e="rejeitado">Rejeitar</button>`:'<span class="err">Rejeitado</span>'}</div></div>`}).join('')||'<p class="note">Não há nada à espera. 🎉</p>'}`;
 $('#tog').onclick=()=>{verTodos=!verTodos;verRet=false;painel()};const tr=$('#togr');if(tr)tr.onclick=()=>{verRet=!verRet;painel()};
 pane().onclick=async ev=>{const b=ev.target.closest('[data-mod]');if(!b)return;b.disabled=true;await db.moderar(b.dataset.mod,b.dataset.e);painel()};
}

/* --- Resultados --- */
async function pResultados(){
 const e=edicao(edSel||dest);if(!e){pane().innerHTML='<p class="note">Sem edições.</p>';return}
 const [cont,coms]=await Promise.all([db.todasContagens(e.n).catch(()=>({})),db.comentarios({ed:e.n}).catch(()=>[])]);
 const csv=[['pagina','artigo','bloco','pergunta','opcao','votos']];
 const html=e.artigos.map(a=>{const ca=cont[a.id]||{};let tot=0;
  const blocos=a.b.map((b,bi)=>{const c=ca[String(bi)]||{},t=soma(c);tot+=t;
   if(b.t==='reacoes'){REACOES.forEach(([k,,l])=>csv.push([a.p,a.ti,TIPOS[b.t],'',l,c[k]||0]));return `<p>${REACOES.map(([k,em])=>em+' '+(c[k]||0)).join(' &nbsp; ')}</p>`}
   if(b.t==='fotos'){const fs=[];for(let k=1;k<=b.n;k++){const n=soma(ca[bi+':'+k]);tot+=n;fs.push([k,n]);csv.push([a.p,a.ti,TIPOS[b.t],'','Foto '+k,n])}fs.sort((x,y)=>y[1]-x[1]);return `<p>Fotos mais gostadas: ${fs.filter(f=>f[1]).slice(0,3).map(f=>`Foto ${f[0]} (${f[1]} ♥)`).join(', ')||'ainda nenhuma'}</p>`}
   if(b.t==='sondagem'||b.t==='quiz'){b.o.forEach((o,oi)=>csv.push([a.p,a.ti,TIPOS[b.t],b.q,o,c[oi]||0]));
    return `<p style="margin:10px 0 6px"><b>${esc(b.q)}</b>${b.t==='quiz'&&t?` · ${Math.round((c[b.c]||0)*100/t)}% acertaram`:''}</p><div class="opts res">${b.o.map((o,oi)=>{const p=t?Math.round((c[oi]||0)*100/t):0;return `<div class="opt"><span class="bar" style="width:${p}%"></span><span>${esc(o)}</span><span class="pct">${c[oi]||0} · ${p}%</span></div>`}).join('')}</div>`}
   if(b.t==='estrelas'){let s=0;for(const k in c)s+=Number(k)*c[k];csv.push([a.p,a.ti,TIPOS[b.t],b.q,'media',t?(s/t).toFixed(2):'']);return `<p>${esc(b.q)} <b>${t?(s/t).toFixed(1)+' ★':'sem votos'}</b> <span class="note">(${t})</span></p>`}
   if(b.t==='texto'||b.t==='audio')return '';if(b.t==='sopa'||b.t==='cruzadas'){csv.push([a.p,a.ti,TIPOS[b.t],b.q||'','resolveram',t]);return `<p>${TIPOS[b.t]}: <b>${t}</b> ${t===1?'leitor resolveu':'leitores resolveram'}</p>`}const n=coms.filter(x=>x.art===a.id&&x.tipo===(b.t==='perguntas'?'pergunta':b.t)).length;return `<p>${TIPOS[b.t]}: <b>${n}</b> recebidos</p>`}).join('');
  return `<div class="card"><span class="tag">pág. ${esc(a.p)}</span> <b>${esc(a.ti)}</b> <span class="note">· ${tot} interações</span>${blocos}</div>`}).join('');
 pane().innerHTML=`<div class="row" style="align-items:center"><div>${selEd()}</div><a class="btn sm" href="#e${e.n}-relatorio" style="flex:0 0 auto;text-decoration:none;line-height:26px">Relatório (PDF)</a><a class="btn sm" href="#e${e.n}-top" style="flex:0 0 auto;text-decoration:none;line-height:26px">Ranking</a><a class="btn sm" href="#tv" style="flex:0 0 auto;text-decoration:none;line-height:26px">Modo TV</a><button class="btn sm" id="melhores" style="flex:0 0 auto">Melhores do ano</button><button class="btn sm" id="csv" style="flex:0 0 auto">Copiar resultados (CSV)</button></div>${html}`;
 bindSel(pResultados);const mb=$('#melhores');if(mb)mb.onclick=()=>melhoresAno(mb);
 $('#csv').onclick=async ev=>{try{await navigator.clipboard.writeText(csv.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n'));ev.target.textContent='Copiado! Cola no Excel.'}catch(e){ev.target.textContent='Não deu para copiar'}};
}

/* --- Códigos QR --- */
function qrImg(url,titulo,sub){
 if(!window.qrcode)return '';
 const qr=window.qrcode(0,'M');qr.addData(url);qr.make();
 const n=qr.getModuleCount(),cell=10,m=4*cell,W=n*cell+2*m,H=W+64;
 const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
 x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#16181d';
 for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(qr.isDark(r,k))x.fillRect(m+k*cell,m+r*cell,cell,cell);
 x.textAlign='center';x.font='600 26px Fredoka, sans-serif';x.fillText(titulo,W/2,W+14);
 x.font='18px "Source Sans 3", sans-serif';let s=sub;while(x.measureText(s).width>W-24&&s.length>4)s=s.slice(0,-2);if(s!==sub)s=s.trim()+'…';x.fillText(s,W/2,W+44);
 return c.toDataURL('image/png');
}

 pane().innerHTML=`<div class="row" style="align-items:center"><div>${selEd()}</div><p class="note" style="flex:2 1 300px;margin:0">Os QR apontam para <b>${esc(base)}</b>. ${cfg.base?'':'Define o endereço público em <b>Ligação</b> antes de imprimir.'}</p></div>
 <p class="note">Descarrega cada imagem e arrasta-a para o Canva, junto ao artigo. O primeiro é para a capa e abre a lista de todos os artigos.</p>
 <div class="qrgrid">${itens.map((it,i)=>{const url=it.url||urlArtigo(e,it.a),src=qrImg(url,it.t,it.s);return `<div class="card"><img src="${src}" alt="Código QR: ${esc(it.s)}"><p style="margin:8px 0 4px;font-weight:700;line-height:1.25">${esc(it.a?it.a.ti:(it.nome||'Capa: todos os artigos'))}</p><p class="note" style="margin:0 0 8px">${it.a?'pág. '+esc(it.a.p):'N.º'+e.n}</p><div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap"><a class="btn sm" href="${src}" download="${esc(it.f)}.png" style="text-decoration:none;line-height:26px">Descarregar</a><button class="btn sm" data-url="${esc(url)}">Copiar ligação</button>${it.a?`<button class="btn sm" data-social="${i}">Imagem para redes</button>`:''}</div></div>`}).join('')}</div>
 ${pzs.length?`<h3 style="margin-top:22px">Passatempos para o jornal em papel</h3><p class="note">A grelha é a mesma que os leitores resolvem na Participa. A solução vai para o número seguinte.</p><div class="qrgrid">${pzs.map(([a,b,bi])=>`<div class="card"><img src="${pngPassatempo(b,false)}" alt="${esc(TIPOS[b.t])}"><p style="margin:8px 0 4px;font-weight:700">${esc(b.q||TIPOS[b.t])}</p><p class="note" style="margin:0 0 8px">pág. ${esc(a.p)} · ${esc(a.ti)}</p><div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap"><button class="btn sm" data-pzpng="${esc(a.id)}:${bi}:0">Grelha (PNG)</button><button class="btn sm" data-pzpng="${esc(a.id)}:${bi}:1">Solução (PNG)</button>${b.t==='cruzadas'?`<button class="btn sm" data-pztx="${esc(a.id)}:${bi}">Copiar pistas</button>`:''}</div></div>`).join('')}</div>`:''}`;
 bindSel(pQR);
 pane().onclick=async ev=>{
  const dl=ev.target.closest('a[download]');
  if(dl&&window.claude&&window.claude.use){ev.preventDefault();try{const d=await window.claude.use('downloads');if(!d)throw 0;const blob=await (await fetch(dl.href)).blob();await d.save({filename:dl.getAttribute('download'),data:blob})}catch(e){dl.textContent='Clica com o botão direito na imagem'}return}
  const so=ev.target.closest('[data-social]');if(so){so.disabled=true;so.textContent='A preparar…';try{const it=itens[Number(so.dataset.social)];await baixar(d2b(await imagemSocial(e,it.a)),'redes-n'+e.n+'-'+it.a.id+'.png');so.textContent='Imagem para redes'}catch(err){console.warn(err);so.textContent='Não foi possível'}so.disabled=false;return}

  const pt=ev.target.closest('[data-pztx]');if(pt){const [aid,bi]=pt.dataset.pztx.split(':'),b=e.artigos.find(x=>x.id===aid).b[Number(bi)],T=h=>b.w.filter(q=>q.h===h).map(q=>q.n+'. '+q.d).join('\n');try{await navigator.clipboard.writeText('Horizontais\n'+T(true)+'\n\nVerticais\n'+T(false));pt.textContent='Copiadas!'}catch(err){pt.textContent='Não deu para copiar'}return}
  const b=ev.target.closest('[data-url]');if(!b)return;try{await navigator.clipboard.writeText(b.dataset.url);b.textContent='Copiada!'}catch(e){b.textContent=b.dataset.url}};

async function baixar(blob,nome){

/* Reduz para 2400 px e regrava em JPG: a foto fica leve e perde a localização GPS. */
async function comprimir(file){
 try{const bm=await createImageBitmap(file),s=Math.min(1,2400/Math.max(bm.width,bm.height)),c=document.createElement('canvas');
  c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bm,0,0,c.width,c.height);if(bm.close)bm.close();
  const b=await new Promise(ok=>c.toBlob(ok,'image/jpeg',.88));if(b)return b}catch(e){}
 if(file.size<=10e6&&/^image\//.test(file.type))return file;
 throw new Error('imagem');
}

 <details open><summary>Notícia</summary><p>Conta o que aconteceu, do mais importante para o menos importante. O primeiro parágrafo responde a <b>quem</b>, <b>o quê</b>, <b>quando</b> e <b>onde</b>; os seguintes explicam <b>como</b> e <b>porquê</b>. Frases curtas, uma ideia por parágrafo.</p>
 <p class="ex">Exemplo inventado: Na quarta-feira, 12 de novembro, cerca de 80 alunos do 2.º ciclo participaram na limpeza da praia do porto da Calheta. A atividade foi organizada pela Brigada Eco-escola e recolheu doze sacos de lixo, sobretudo plástico.

/* --- 10: verificação antes de enviar --- */
function verificar(f){
 const out=[],T=String(f.titulo||'').trim(),nt=palavras(T),pal=palavras(f.texto),pars=String(f.texto||'').split(/\n+/).filter(p=>p.trim()),longos=pars.filter(p=>palavras(p)>110).length;
 out.push([!!T&&nt<=12,!T?'Falta o título':nt<=12?'Título curto e direto':'O título tem '+nt+' palavras: tenta ficar até 12']);
 out.push([!!String(f.entrada||'').trim(),String(f.entrada||'').trim()?'Tem entrada':'Sem entrada: uma frase a resumir ajuda o leitor']);
 out.push([pal>=80,pal>=80?'Texto com '+pal+' palavras':'Texto curto ('+pal+' palavras)']);
 out.push([!longos,longos?longos+(longos===1?' parágrafo muito longo':' parágrafos muito longos')+': divide-os':'Parágrafos com bom tamanho']);
 const temData=/(\d{1,2}\s+de\s+[a-zç]+|\d{1,2}\/\d{1,2}|segunda|terça|quarta|quinta|sexta|sábado|domingo|ontem|semana passada|dia\s+\d)/i.test(f.texto||'');
 out.push([temData,temData?'Diz quando aconteceu':'Não encontrei a data: diz quando aconteceu']);
 if((f.fotos||[]).length){const s=f.fotos.filter(x=>!String(x.legenda||'').trim()).length;out.push([!s,s?s+(s===1?' foto sem legenda':' fotos sem legenda'):'Todas as fotos têm legenda'])}
 const grita=/[A-ZÁÉÍÓÚÂÊÔÃÕÇ ]{25,}/.test(f.texto||'');out.push([!grita,grita?'Há frases inteiras em maiúsculas':'Sem frases em maiúsculas']);
 return out;
}

/* --- 16: lembretes de prazo --- */
function lembreteHTML(info,minhas){
 const out=[];
 if(info.prazo&&info.aberta!==false){const d=Math.round((new Date(info.prazo+'T00:00')-new Date(new Date().toDateString()))/864e5);if(d>=0&&d<=3)out.push(d===0?'Hoje é o último dia para entregar artigos!':d===1?'Falta 1 dia para o fim do prazo.':`Faltam ${d} dias para o fim do prazo.`)}
 const alt=minhas.filter(s=>s.estado==='alteracoes').length;if(alt)out.push(`Tens ${alt} ${alt===1?'artigo':'artigos'} à espera de correção: vê em "Os meus artigos".`);
 return out.length?`<div class="notaeq" style="margin:0 0 14px">${out.map(esc).join('<br>')}</div>`:'';
}

  x.strokeStyle='#16181d';x.lineWidth=2;x.strokeRect(pad-6,pad-6,n*cs+12,n*cs+12)}

const AO90=[['acção','ação'],['acções','ações'],['direcção','direção'],['óptimo','ótimo'],['óptima','ótima'],['actual','atual'],['actualmente','atualmente'],['actividade','atividade'],['actividades','atividades'],['colecção','coleção'],['projecto','projeto'],['projectos','projetos'],['objectivo','objetivo'],['objectivos','objetivos'],['director','diretor'],['directora','diretora'],['efectuar','efetuar'],['efectivamente','efetivamente'],['correcto','correto'],['correcta','correta'],['exacto','exato'],['exacta','exata'],['selecção','seleção'],['electricidade','eletricidade'],['eléctrico','elétrico'],['protecção','proteção'],['adopção','adoção'],['baptismo','batismo'],['Janeiro','janeiro'],['Fevereiro','fevereiro'],['Março','março'],['Abril','abril'],['Maio','maio'],['Junho','junho'],['Julho','julho'],['Agosto','agosto'],['Setembro','setembro'],['Outubro','outubro'],['Novembro','novembro'],['Dezembro','dezembro']];
function revisaoLocal(t){const out=[];

 let m;const re2=/ {2,}/g;while((m=re2.exec(t)))out.push({o:m.index,l:m[0].length,msg:'Espaços a mais.',rep:[' ']});
 const re3=/ +([,.;:!?])/g;while((m=re3.exec(t)))out.push({o:m.index,l:m[0].length,msg:'Não se põe espaço antes da pontuação.',rep:[m[1]]});
 const re4=/(?<![\p{L}])(\p{L}+)\s+\1(?![\p{L}])/giu;while((m=re4.exec(t)))if(m[1].length>2)out.push({o:m.index,l:m[0].length,msg:'Palavra repetida.',rep:[m[1]]});
 (t.match(/[^.!?\n]+[.!?]?/g)||[]).reduce((pos,fr)=>{const p=palavras(fr);if(p>40)out.push({o:t.indexOf(fr,pos),l:fr.length,msg:`Frase muito longa (${p} palavras): divide-a em duas.`,rep:[],longa:true});return pos+fr.length},0);
 return out}
async function revisaoLT(t){

function diffPal(a,b){
 const A=a.split(/(\s+)/),B=b.split(/(\s+)/),n=A.length,m=B.length;
 if(n*m>4e6)return a===b?esc(b):`<del>${esc(a)}</del><ins>${esc(b)}</ins>`;
 const D=Array.from({length:n+1},()=>new Uint16Array(m+1));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)D[i][j]=A[i]===B[j]?D[i+1][j+1]+1:Math.max(D[i+1][j],D[i][j+1]);
 let i=0,j=0,h='';while(i<n&&j<m){if(A[i]===B[j]){h+=esc(A[i]);i++;j++}else if(D[i+1][j]>=D[i][j+1]){h+=`<del>${esc(A[i])}</del>`;i++}else{h+=`<ins>${esc(B[j])}</ins>`;j++}}
 while(i<n){h+=`<del>${esc(A[i])}</del>`;i++}while(j<m)h+=`<ins>${esc(B[j++])}</ins>`;return h.replace(/<\/del><del>/g,'').replace(/<\/ins><ins>/g,'');
}

 pane().innerHTML=`<div class="card"><h3>Concurso de fotografia</h3><form id="cc"><div class="row"><div style="flex:2 1 240px"><label for="cc-t" style="margin-top:0">Tema</label><input id="cc-t" maxlength="80" value="${esc(ci.tema||'')}" placeholder="ex.: O outono em São Jorge"></div><div style="flex:0 1 180px"><label for="cc-a" style="margin-top:0">Envios até</label><input id="cc-a" type="date" value="${esc(ci.ate||'')}"></div></div>
  <label for="cc-d">Regras ou descrição</label><input id="cc-d" maxlength="300" value="${esc(ci.desc||'')}" placeholder="ex.: Fotografias na horizontal, sem caras. A vencedora sai na capa.">
  <label class="chk"><input type="checkbox" id="cc-o" ${ci.aberto?'checked':''}> A receber fotografias</label><label class="chk" style="margin-top:6px"><input type="checkbox" id="cc-v" ${ci.votacao?'checked':''}> Votação aberta (cada leitor vota em até 3)</label>
  <div class="row" style="margin-top:10px"><button class="btn sm pri" style="flex:0 0 auto">Guardar</button>${ci.id?`<button type="button" class="btn sm" id="cc-n" style="flex:0 0 auto">${confirmar==='novocc'?'Confirmar: começar um concurso novo?':'Começar um concurso novo'}</button>`:''}<a class="btn sm" href="#concurso" style="flex:0 0 auto;text-decoration:none;line-height:26px">Ver a página</a><span class="msg" id="cc-m"></span></div></form>
  ${pend.length?`<h3 style="margin-top:16px">À espera de aprovação (${pend.length})</h3><div class="thumbs">${pend.map(f=>`<div class="th">${urls[f.path]?`<img src="${esc(urls[f.path])}" alt="${esc(f.legenda||'')}">`:''}<b>${esc(f.legenda||'')}</b><span class="ls">${esc(f.nome||'')}${f.turma?' · '+esc(f.turma):''}${f.estado==='retido'?' · <span class="flag">verificar linguagem</span>':''}</span><div class="thb"><button class="btn sm pri" data-fa="${esc(f.id)}">Aprovar</button><button class="btn sm" data-fr="${esc(f.id)}">Rejeitar</button></div></div>`).join('')}</div>`:''}
  ${apr.length?`<h3 style="margin-top:16px">Na galeria, por votos</h3><div class="thumbs">${apr.map((f,i)=>`<div class="th">${urls[f.path]?`<img src="${esc(urls[f.path])}" alt="${esc(f.legenda||'')}">`:''}<b>${i<3?['🥇','🥈','🥉'][i]+' ':''}${esc(f.legenda||'')}</b><span class="ls">${esc(f.nome||'')}${f.turma?' · '+esc(f.turma):''} · ${cont[f.id]||0} ♥</span><div class="thb"><button class="btn sm" data-fd="${esc(f.id)}">Descarregar</button><button class="btn sm" data-fx="${esc(f.id)}">${confirmar==='foto'+f.id?'Confirmar?':'Apagar'}</button></div></div>`).join('')}</div>`:''}</div>
 <div class="card"><h3>Cartas ao jornal</h3><p class="note" style="margin-top:0">As cartas novas aparecem na Moderação. Aqui ficam as aprovadas, prontas para o jornal.</p>${capr.length?`<ul class="coms">${capr.slice(0,20).map(c=>`<li><div class="txt">${esc(c.texto)}</div><small>${esc(c.nome||'Anónimo')}${c.turma?' · '+esc(c.turma):''} · ${palavras(c.texto)} palavras</small></li>`).join('')}</ul><button class="btn sm" id="ct-c" style="margin-top:10px">Copiar as cartas para o jornal</button>`:'<p class="note">Ainda não há cartas aprovadas.</p>'}</div>
 <div class="card"><h3>Agenda da escola</h3><form id="ag"><div class="row"><div style="flex:0 1 170px"><label for="ag-d" style="margin-top:0">Dia</label><input id="ag-d" type="date" required></div><div style="flex:0 1 120px"><label for="ag-h" style="margin-top:0">Hora (opcional)</label><input id="ag-h" type="time"></div><div style="flex:2 1 220px"><label for="ag-t" style="margin-top:0">O quê</label><input id="ag-t" maxlength="100" required placeholder="ex.: Corta-mato escolar"></div><div style="flex:1 1 160px"><label for="ag-l" style="margin-top:0">Onde</label><input id="ag-l" maxlength="80" placeholder="ex.: Pavilhão"></div></div>
  <label for="ag-x">Detalhes (opcional)</label><input id="ag-x" maxlength="200"><div class="row" style="margin-top:10px"><button class="btn sm pri" style="flex:0 0 auto">Acrescentar</button><a class="btn sm" href="#agenda" style="flex:0 0 auto;text-decoration:none;line-height:26px">Ver a agenda</a><span class="msg" id="ag-m"></span></div></form>
  ${agL.length?`<table class="t" style="margin-top:12px"><tbody>${agL.map(x=>`<tr><td style="white-space:nowrap">${esc(fmtData(x.d))}${x.h?' · '+esc(x.h):''}</td><td>${esc(x.t)}${x.l?' <span class="note">· '+esc(x.l)+'</span>':''}</td><td class="nu"><button class="btn sm" data-agrm="${esc(x.id)}">Retirar</button></td></tr>`).join('')}</tbody></table>`:''}</div>
 <div class="card"><h3>Avisos no telemóvel</h3><p class="note" style="margin-top:0">${nsub==null?'Disponível só online.':`<b>${nsub}</b> ${nsub===1?'aparelho recebe':'aparelhos recebem'} avisos. Os leitores ativam-nos na página da edição.`}</p>
  <form id="av"><label for="av-t" style="margin-top:0">Título</label><input id="av-t" maxlength="60" value="${esc(e?'Saiu o Repórter da Calheta n.º'+e.n+'!':'Repórter da Calheta')}"><label for="av-x">Mensagem</label><input id="av-x" maxlength="140" value="Lê, vota e participa: o QR está em cada página."><label for="av-u">Abrir</label><select id="av-u"><option value="${e?'#e'+e.n:''}">A edição em destaque</option><option value="#concurso">O concurso de fotografia</option><option value="#agenda">A agenda</option><option value="#cartas">As cartas ao jornal</option></select>
  <div class="row" style="margin-top:10px"><button class="btn sm pri" style="flex:0 0 auto">${confirmar==='avisar'?'Confirmar: enviar a todos?':'Enviar aviso'}</button><span class="msg" id="av-m"></span></div></form></div>`;
 const msg=(id,t,ok)=>{const el=$(id);if(el){el.className='msg '+(ok?'ok':'err');el.textContent=t}};
 const novoCI=()=>({id:ci.id||('c'+Date.now().toString(36)),tema:$('#cc-t').value.trim(),ate:$('#cc-a').value||'',desc:$('#cc-d').value.trim(),aberto:$('#cc-o').checked,votacao:$('#cc-v').checked});
 $('#cc').onsubmit=async ev=>{ev.preventDefault();try{await db.setDef('concurso',novoCI());pComunidade()}catch(e){console.warn(e);msg('#cc-m','Não foi possível guardar.')}};
 const ccn=$('#cc-n');if(ccn)ccn.onclick=async()=>{if(confirmar!=='novocc'){confirmar='novocc';return pComunidade()}confirmar=null;try{await db.setDef('concurso',{id:'c'+Date.now().toString(36),tema:'',aberto:false,votacao:false});pComunidade()}catch(e){console.warn(e)}};
 const ctc=$('#ct-c');if(ctc)ctc.onclick=async()=>{const t='CARTAS AO JORNAL\n\n'+capr.map(c=>c.texto+'\n'+(c.nome||'Anónimo')+(c.turma?', '+c.turma:'')).join('\n\n');try{await navigator.clipboard.writeText(t);ctc.textContent='Copiado!'}catch(e){ctc.textContent='Não deu para copiar'}};
 $('#ag').onsubmit=async ev=>{ev.preventDefault();const t=$('#ag-t').value.trim(),d=$('#ag-d').value;if(!t||!d)return msg('#ag-m','Falta o dia ou o título.');const L=(ag||[]).concat({id:Date.now().toString(36),d,h:$('#ag-h').value||'',t,l:$('#ag-l').value.trim(),x:$('#ag-x').value.trim()});try{await db.setDef('agenda',L);pComunidade()}catch(e){console.warn(e);msg('#ag-m','Não foi possível guardar.')}};
 $('#av').onsubmit=async ev=>{ev.preventDefault();if(confirmar!=='avisar'){confirmar='avisar';ev.submitter&&(ev.submitter.textContent='Confirmar: enviar a todos?');return}confirmar=null;const b=ev.submitter;if(b)b.disabled=true;
  try{const r=await db.avisar({titulo:$('#av-t').value.trim(),texto:$('#av-x').value.trim(),url:(cfg.base||location.href.split('#')[0])+$('#av-u').value});msg('#av-m',`Enviado para ${r&&r.enviados!=null?r.enviados:'os'} ${r&&r.enviados===1?'aparelho':'aparelhos'}.`,1)}catch(e){console.warn(e);msg('#av-m',e.message||'Não foi possível enviar.')}if(b){b.disabled=false;b.textContent='Enviar aviso'}};
 pane().onclick=async ev=>{const b=ev.target.closest('button');if(!b)return;const d=b.dataset,f=fotos.find(x=>x.id===(d.fa||d.fr||d.fd||d.fx));try{
  if(d.fa||d.fr){b.disabled=true;await db.moderarFoto(f.id,d.fa?'aprovado':'rejeitado');return pComunidade()}
  if(d.fd){const bl=await db.blobConcurso(f.path);if(bl)baixar(bl,'concurso-'+slug(f.legenda||'foto')+'-'+slug(f.nome||'')+'.jpg');return}
  if(d.fx){if(confirmar!=='foto'+f.id){confirmar='foto'+f.id;return pComunidade()}confirmar=null;await db.apagarFotoConcurso(f);return pComunidade()}
  if(d.agrm){await db.setDef('agenda',(ag||[]).filter(x=>x.id!==d.agrm));return pComunidade()}}catch(e){console.warn(e)}};
}

/* --- 25: imagem para as redes sociais --- */
async function imagemSocial(e,a){
 await Promise.all(['400 90px "UnifrakturMaguntia"','700 40px "Kalam"','600 80px "Fredoka"','400 30px "Source Sans 3"','600 30px "Source Sans 3"'].map(f=>document.fonts&&document.fonts.load?document.fonts.load(f).catch(()=>{}):0));
 const W=1080,H=1350,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d'),M=80;
 const linhas=(t,max,font)=>{x.font=font;const ws=String(t||'').split(/\s+/),out=[];let l='';ws.forEach(w=>{const tt=l?l+' '+w:w;if(x.measureText(tt).width>max&&l){out.push(l);l=w}else l=tt});if(l)out.push(l);return out};
 x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#16181d';x.textAlign='center';x.font='400 104px "UnifrakturMaguntia", serif';x.fillText('Repórter da Calheta',W/2,150);
 x.fillRect(M,182,W-2*M,6);x.fillRect(M,196,W-2*M,2);x.font='600 28px "Source Sans 3", sans-serif';x.textAlign='left';x.fillText('Calheta · São Jorge',M,240);x.textAlign='right';x.fillText('N.º'+e.n+(e.titulo?' · '+e.titulo:''),W-M,240);
 x.save();x.translate(M,350);x.rotate(-0.03);x.font='700 44px "Kalam", cursive';x.textAlign='left';const tg=(a.s||'Notícias');const tw=x.measureText(tg).width;x.fillStyle='#ffd84d';x.fillRect(-6,-48,tw+36,64);x.fillStyle='#16181d';x.fillText(tg,12,0);x.restore();
 let fs=96,L;do{L=linhas(a.ti,W-2*M,`600 ${fs}px "Fredoka", sans-serif`);fs-=6}while(L.length>5&&fs>54);fs+=6;
 x.fillStyle='#1f5fbf';x.textAlign='left';x.font=`600 ${fs}px "Fredoka", sans-serif`;let y=470;L.forEach(l=>{x.fillText(l,M,y);y+=fs*1.08});
 if(a.r){x.fillStyle='#5b5f6d';const R=linhas(a.r,W-2*M,'400 36px "Source Sans 3", sans-serif').slice(0,4);y+=20;R.forEach(l=>{x.fillText(l,M,y);y+=48})}
 const qs=250,qy=H-qs-110;
 if(window.qrcode){const q=window.qrcode(0,'M');q.addData(urlArtigo(e,a));q.make();const n=q.getModuleCount(),s=Math.floor(qs/n),ox=W-M-n*s;x.fillStyle='#16181d';for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect(ox+k*s,qy+r*s,s,s)}
 x.fillStyle='#16181d';x.font='600 46px "Fredoka", sans-serif';x.fillText('Leste? Participa!',M,qy+90);x.font='400 32px "Source Sans 3", sans-serif';x.fillStyle='#5b5f6d';x.fillText('Aponta a câmara ao código, vota',M,qy+145);x.fillText('e deixa a tua opinião.',M,qy+188);x.fillText('Pág. '+a.p+' do jornal em papel.',M,qy+231);
 x.fillStyle='#ffd84d';x.fillRect(0,H-40,W,40);
 return cv.toDataURL('image/png');
}
