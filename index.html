*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Source Sans 3",system-ui,sans-serif;overflow-x:clip}

const idb={h:null,mem:new Map(),
 async open(){if(this.h===null)this.h=await new Promise(ok=>{try{const r=indexedDB.open('rc-fotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(false)}catch(e){ok(false)}});return this.h},
 async put(k,v){const d=await this.open();if(!d){this.mem.set(k,v);return}await new Promise(ok=>{try{const t=d.transaction('f','readwrite');t.objectStore('f').put(v,k);t.oncomplete=ok;t.onerror=()=>{this.mem.set(k,v);ok()}}catch(e){this.mem.set(k,v);ok()}})},
 async get(k){if(this.mem.has(k))return this.mem.get(k);const d=await this.open();if(!d)return null;return new Promise(ok=>{try{const r=d.transaction('f').objectStore('f').get(k);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>ok(null)}catch(e){ok(null)}})},
 async del(k){this.mem.delete(k);const d=await this.open();if(d)await new Promise(ok=>{try{const t=d.transaction('f','readwrite');t.objectStore('f').delete(k);t.oncomplete=ok;t.onerror=ok}catch(e){ok()}})}
};

/* ======== Base de dados: modo demonstração (só neste browser) ======== */
const local={
 d:LS.get('rc-db',null)||{edicoes:[ED1],destaque:1,votos:{},coms:[]},
 save(){LS.set('rc-db',this.d)},
 async edicoes(){return this.d.edicoes.slice().sort((a,b)=>a.n-b.n)},
 async destaque(){return this.d.destaque},
 async setDestaque(n){this.d.destaque=n;this.save()},
 async guardarEdicao(e){const i=this.d.edicoes.findIndex(x=>x.n===e.n);if(i>=0)this.d.edicoes[i]=e;else this.d.edicoes.push(e);this.save()},
 async apagarEdicao(n){this.d.edicoes=this.d.edicoes.filter(x=>x.n!==n);this.save()},
 async todasContagens(ed){const out={},pre=ed+'|';for(const k in this.d.votos){if(!k.startsWith(pre))continue;const[,art,ch]=k.split('|');const a=out[art]=out[art]||{},m=a[ch]=a[ch]||{};for(const dv in this.d.votos[k]){const o=this.d.votos[k][dv];m[o]=(m[o]||0)+1}}return out},
 async contagens(ed,art){return (await this.todasContagens(ed))[art]||{}},
 async meus(ed,art){const out={},pre=ed+'|'+art+'|';for(const k in this.d.votos)if(k.startsWith(pre)&&this.d.votos[k][dev]!=null)out[k.slice(pre.length)]=this.d.votos[k][dev];return out},
 async votar(ed,art,ch,op){const k=ed+'|'+art+'|'+ch;const v=this.d.votos[k]=this.d.votos[k]||{};if(op==null)delete v[dev];else v[dev]=op;this.save()},
 async comentar(c){this.d.coms.push(Object.assign({},c,{id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),estado:'pendente',criado:new Date().toISOString()}));this.save()},
 async comentarios(f){return this.d.coms.filter(x=>(!f.ed||x.ed===f.ed)&&(!f.art||x.art===f.art)&&(!f.estado||x.estado===f.estado)&&(!f.tipo||x.tipo===f.tipo)).sort((a,b)=>a.criado<b.criado?1:-1)},
 async moderar(id,estado){const c=this.d.coms.find(x=>x.id===id);if(c){c.estado=estado;this.save()}},
 L(){return this.d.subs||(this.d.subs=[])},
 async eRedator(){return !!LS.get('rc-redator',false)},
 async entrarRedacao(c){if(String(c).trim().toLowerCase()!==String(this.d.codigoRedacao||cfg.pinRedacao).toLowerCase())return false;LS.set('rc-redator',true);return true},
 async redacaoInfo(){return this.d.redacao||{}},
 async setRedacaoInfo(o){this.d.redacao=o;this.save()},
 async codigoRedacao(){return this.d.codigoRedacao||cfg.pinRedacao},
 async setCodigoRedacao(c){this.d.codigoRedacao=c;this.save()},
 async limparRedatores(){LS.set('rc-redator',false)},
 async submeter(s){const t=new Date().toISOString(),id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);this.L().push(Object.assign({},s,{id,autor:dev,estado:'recebido',nota_equipa:null,pagina:null,criado:t,atualizado:t}));this.save();return id},
 async editarSub(id,s){const x=this.L().find(y=>y.id===id);if(!x)return;const c=Object.assign({},s);if(!prof){delete c.nota_equipa;delete c.pagina;delete c.edicao;c.estado='recebido'}Object.assign(x,c,{atualizado:new Date().toISOString()});this.save()},
 async minhas(){return this.L().filter(x=>x.autor===dev).sort((a,b)=>a.criado<b.criado?1:-1)},
 async subs(){return this.L().slice().sort((a,b)=>a.criado<b.criado?1:-1)},
 async apagarSub(s){for(const f of s.fotos||[])await idb.del(f.path);this.d.subs=this.L().filter(y=>y.id!==s.id);this.save()},
 async subirFoto(b,ext){const p=dev+'/'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)+'.'+ext;await idb.put(p,b);return p},
 async urlsFotos(paths){const o={};for(const p of paths){const b=await idb.get(p);if(b)o[p]=URL.createObjectURL(b)}return o},
 async blobFoto(p){return idb.get(p)},
 async apagarFotos(paths){for(const p of paths)await idb.del(p)}
};

/* ======== Base de dados: Supabase (online, partilhada) ======== */
function supa(cl){
 const chk=r=>{if(r.error)throw r.error;return r.data};
 return {
  cl,
  async edicoes(){return chk(await cl.from('edicoes').select('dados').order('numero')).map(r=>r.dados)},
  async destaque(){const d=chk(await cl.from('definicoes').select('valor').eq('chave','destaque').maybeSingle());return d?Number(d.valor):null},
  async setDestaque(n){chk(await cl.from('definicoes').upsert({chave:'destaque',valor:String(n)}))},
  async guardarEdicao(e){chk(await cl.from('edicoes').upsert({numero:e.n,dados:e}))},
  async apagarEdicao(n){chk(await cl.from('edicoes').delete().eq('numero',n))},
  async todasContagens(ed){const out={};chk(await cl.rpc('contagens_edicao',{p_edicao:ed})).forEach(r=>{const a=out[r.artigo]=out[r.artigo]||{};(a[r.chave]=a[r.chave]||{})[r.opcao]=Number(r.total)});return out},
  async contagens(ed,art){return (await this.todasContagens(ed))[art]||{}},
  async meus(ed,art){const out={};chk(await cl.from('votos').select('chave,opcao').eq('edicao',ed).eq('artigo',art)).forEach(r=>out[r.chave]=r.opcao);return out},
  async votar(ed,art,ch,op){if(op==null)chk(await cl.from('votos').delete().match({edicao:ed,artigo:art,chave:ch}));else chk(await cl.from('votos').upsert({edicao:ed,artigo:art,chave:ch,opcao:op},{onConflict:'edicao,artigo,chave,utilizador'}))},
  async comentar(c){chk(await cl.from('comentarios').insert({edicao:c.ed,artigo:c.art,tipo:c.tipo,nome:c.nome,turma:c.turma,texto:c.texto}))},
  async comentarios(f){let q=cl.from('comentarios').select('*').order('criado',{ascending:false});if(f.ed)q=q.eq('edicao',f.ed);if(f.art)q=q.eq('artigo',f.art);if(f.estado)q=q.eq('estado',f.estado);if(f.tipo)q=q.eq('tipo',f.tipo);return chk(await q).map(r=>({id:r.id,ed:r.edicao,art:r.artigo,tipo:r.tipo,nome:r.nome,turma:r.turma,texto:r.texto,estado:r.estado,criado:r.criado}))},
  async moderar(id,estado){chk(await cl.from('comentarios').update({estado}).eq('id',id))},
  async uid(){const {data}=await cl.auth.getSession();return data.session?.user?.id},
  async eRedator(){return !!chk(await cl.rpc('e_redator'))},
  async entrarRedacao(c){return !!chk(await cl.rpc('entrar_redacao',{p_codigo:String(c)}))},
  async redacaoInfo(){const d=chk(await cl.from('definicoes').select('valor').eq('chave','redacao').maybeSingle());try{return d?JSON.parse(d.valor):{}}catch(e){return {}}},
  async setRedacaoInfo(o){chk(await cl.from('definicoes').upsert({chave:'redacao',valor:JSON.stringify(o)}))},
  async codigoRedacao(){return chk(await cl.rpc('ver_codigo_redacao'))||''},
  async setCodigoRedacao(c){chk(await cl.rpc('definir_codigo_redacao',{p_codigo:c}))},
  async limparRedatores(){chk(await cl.rpc('limpar_redatores'))},
  async submeter(s){return chk(await cl.from('submissoes').insert(s).select('id').single()).id},
  async editarSub(id,s){chk(await cl.from('submissoes').update(s).eq('id',id))},
  async minhas(){const u=await this.uid();return chk(await cl.from('submissoes').select('*').eq('autor',u).order('criado',{ascending:false}))},
  async subs(){return chk(await cl.from('submissoes').select('*').order('criado',{ascending:false}))},
  async apagarSub(s){const p=(s.fotos||[]).map(f=>f.path);if(p.length)await cl.storage.from('submissoes').remove(p);chk(await cl.from('submissoes').delete().eq('id',s.id))},
  async subirFoto(b,ext){const path=(await this.uid())+'/'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)+'.'+ext;chk(await cl.storage.from('submissoes').upload(path,b,{contentType:b.type||'image/jpeg'}));return path},
  async urlsFotos(paths){const o={};if(!paths.length)return o;chk(await cl.storage.from('submissoes').createSignedUrls(paths,3600)).forEach(x=>{if(x.signedUrl)o[x.path]=x.signedUrl});return o},
  async blobFoto(p){return chk(await cl.storage.from('submissoes').download(p))},
  async apagarFotos(paths){if(paths.length)chk(await cl.storage.from('submissoes').remove(paths))}
 };
}

let db=local,modo='demo',prof=false,eds=[],dest=1;
const loadScript=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)});

async function init(){
 if(cfg.supabaseUrl&&cfg.supabaseKey){
  try{
   await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js');
   const cl=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey);
   const {data}=await cl.auth.getSession();
   if(!data.session){const r=await cl.auth.signInAnonymously();if(r.error)throw r.error}
   db=supa(cl);extrasSupa(cl,db);modo='online';
  }catch(e){console.warn(e);modo='erro'}
 }
 await carregar();route();
}
async function carregar(){try{eds=await db.edicoes();dest=(await db.destaque())||(eds.length?eds[eds.length-1].n:1)}catch(e){console.warn(e);eds=[]}}
const edicao=n=>eds.find(e=>e.n===n);
const urlArtigo=(e,a)=>(cfg.base||location.href.split('#')[0])+'#e'+e.n+(a?'-'+a.id:'');

/* ======== Rotas ======== */
function route(){
 const h=location.hash.slice(1);
 if(h==='painel')return painel();
 if(h==='redacao')return redacao();
 if(h==='tv')return verTV();
 if(h==='arquivo')return verArquivo();
 if(h==='familias')return verFamilias();
 const mc=h.match(/^caca-(\d+)-(.+)$/);if(mc)return verCaca(Number(mc[1]),mc[2]);
 const mx=h.match(/^e(\d+)-(top|ler|relatorio)$/);if(mx){const ee=edicao(Number(mx[1]));if(ee){atual=null;main.classList.remove('wide');$('#edmeta').textContent='N.º'+ee.n+' · '+(ee.titulo||'');window.scrollTo(0,0);return ({top:verTop,ler:verLer,relatorio:verRelatorio})[mx[2]](ee)}}
 const m=h.match(/^e(\d+)(?:-(.+))?$/);
 const e=edicao(m?Number(m[1]):dest)||eds[eds.length-1];
 if(!e){main.innerHTML='<div class="card">Ainda não há nenhuma edição. <a href="#painel">Abrir o painel do professor</a></div>';return}
 $('#edmeta').textContent='N.º'+e.n+' · '+(e.titulo||'');
 const a=m&&m[2]?e.artigos.find(x=>x.id===m[2]):null;
 a?verArtigo(e,a):verIndice(e);
 window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

 <p class="lead">Cada artigo tem um código QR. Aponta a câmara do telemóvel, vota, reage às fotos e deixa a tua opinião. Também podes escolher o artigo aqui.</p>

 <p class="note" style="margin-top:28px"><a href="#redacao">Redação: enviar um artigo para o jornal</a> · <a href="#painel">Painel do professor</a>${modo==='demo'?' · modo demonstração: os votos ficam só neste aparelho':''}</p>`;
 posIndice(e);
}

let atual=null;
async function verArtigo(e,a){
 atual={e,a};
 let cont={},meus={},coms=[];
 try{[cont,meus,coms]=await Promise.all([db.contagens(e.n,a.id),db.meus(e.n,a.id),db.comentarios({ed:e.n,art:a.id,estado:'aprovado',tipo:'comentario'})])}catch(err){console.warn(err)}
 if(!atual||atual.a!==a)return;
 const i=e.artigos.indexOf(a),prev=e.artigos[i-1],next=e.artigos[i+1];
 main.innerHTML=`
 <span class="tag">pág. ${esc(a.p)} · ${esc(a.s)}</span>
 <h2 class="t">${esc(a.ti)}</h2>
 <p class="lead">Este artigo está no Repórter da Calheta n.º${e.n}, em papel. Diz-nos o que achaste!</p>
 ${a.b.map((b,bi)=>bloco(b,bi,cont,meus,coms)).join('')}
 <div class="row" style="margin-top:22px">
  ${prev?`<a class="btn" href="#e${e.n}-${esc(prev.id)}" style="text-align:center;text-decoration:none;line-height:26px">← ${esc(prev.ti.slice(0,28))}</a>`:''}
  <a class="btn" href="#e${e.n}" style="text-align:center;text-decoration:none;line-height:26px">Todos os artigos</a>
  ${next?`<a class="btn" href="#e${e.n}-${esc(next.id)}" style="text-align:center;text-decoration:none;line-height:26px">${esc(next.ti.slice(0,28))} →</a>`:''}
 </div>`;
 posArtigo(e,a);
}
const soma=o=>Object.values(o||{}).reduce((x,y)=>x+y,0);
function bloco(b,bi,cont,meus,coms){
 const ch=String(bi),c=cont[ch]||{},mine=meus[ch];
 if(b.t==='reacoes')return `<div class="card"><h3>Reage a este artigo</h3><div class="react">${REACOES.map(([k,em,lb])=>`<button data-act="vote" data-ch="${ch}" data-op="${k}" data-toggle="1" class="${mine===k?'mine':''}" aria-pressed="${mine===k}"><b>${em}</b>${lb} · ${c[k]||0}</button>`).join('')}</div></div>`;
 if(b.t==='fotos'){let h='';for(let k=1;k<=b.n;k++){const kk=bi+':'+k,on=meus[kk]!=null,n=soma(cont[kk]);h+=`<button data-act="foto" data-ch="${kk}" class="${on?'mine':''}" aria-pressed="${on}" aria-label="Gosto na foto ${k}">Foto ${k}<i>${on?'♥':'♡'} ${n}</i></button>`}
  return `<div class="card"><h3>Qual é a tua foto preferida?</h3><div class="fotos">${h}</div><p class="note">Os números seguem a ordem das fotos na página do jornal, da esquerda para a direita e de cima para baixo. Podes gostar de várias.</p></div>`}
 if(b.t==='sondagem'||b.t==='quiz'){
  const tot=soma(c),quiz=b.t==='quiz',done=mine!=null,show=done;
  const opts=b.o.map((o,oi)=>{const k=String(oi),n=c[k]||0,p=tot?Math.round(n*100/tot):0;
   let cls=mine===k?'mine':'';if(quiz&&done){if(oi===b.c)cls+=' right';else if(mine===k)cls+=' wrong'}
   return `<button class="opt ${cls}" data-act="vote" data-ch="${ch}" data-op="${k}" ${quiz&&done?'disabled':''}>${show?`<span class="bar" style="width:${p}%"></span>`:''}<span>${esc(o)}${quiz&&done&&oi===b.c?' ✓':''}</span>${show?`<span class="pct">${p}%</span>`:''}</button>`}).join('');
  const fim=quiz?(done?(Number(mine)===b.c?'<p class="ok">Certo! Bem lido.</p>':'<p class="err">Não é bem isso. A resposta certa está assinalada.</p>'):'<p class="note">Escolhe uma resposta. Só tens uma tentativa!</p>'):(done?`<p class="note">${tot} ${tot===1?'voto':'votos'}. Podes mudar o teu voto.</p>`:'<p class="note">Vota para veres os resultados.</p>');
  return `<div class="card"><h3>${quiz?'Quiz: ':''}${esc(b.q)}</h3><div class="opts">${opts}</div>${fim}</div>`}
 if(b.t==='estrelas'){const v=Number(mine||0),tot=soma(c);let s=0;for(const k in c)s+=Number(k)*c[k];
  return `<div class="card"><h3>${esc(b.q)}</h3><div class="stars" role="group">${[1,2,3,4,5].map(k=>`<button data-act="vote" data-ch="${ch}" data-op="${k}" class="${k<=v?'on':''}" aria-label="${k} de 5">★</button>`).join('')}</div><p class="note">${v?`Média: ${(s/tot).toFixed(1)} em 5 · ${tot} ${tot===1?'voto':'votos'}`:'Toca nas estrelas para dar a tua nota.'}</p></div>`}
 if(b.t==='comentario'||b.t==='sugestao'){const sug=b.t==='sugestao';
  return `<div class="card"><h3>${esc(b.q||(sug?'Tens uma sugestão?':'Deixa a tua opinião'))}</h3>
  <form data-form="${b.t}"><div class="row"><div><label for="n${bi}">Primeiro nome ou alcunha</label><input id="n${bi}" name="nome" maxlength="30" autocomplete="off"></div><div style="flex:0 1 120px"><label for="t${bi}">Turma</label><input id="t${bi}" name="turma" maxlength="10" placeholder="ex.: 8.º A" autocomplete="off"></div></div>
  <label for="x${bi}">${sug?'A tua sugestão':'O teu comentário'}</label><textarea id="x${bi}" name="texto" maxlength="400" required></textarea>
  <div class="row" style="margin-top:10px"><button class="btn pri" style="flex:0 0 auto">Enviar</button><span class="msg"></span></div>
  <p class="note">${sug?'Só a equipa do jornal lê as sugestões.':'Os comentários aparecem depois de um professor os aprovar.'} Não escrevas apelidos, moradas, telefones nem nada sobre outras pessoas.</p></form>
  ${sug?'':`<ul class="coms">${coms.length?coms.map(x=>`<li><small>${esc(x.nome||'Anónimo')}${x.turma?' · '+esc(x.turma):''}</small><br>${esc(x.texto)}</li>`).join(''):'<li class="note">Ainda não há comentários aprovados. Sê o primeiro!</li>'}</ul>`}</div>`}
 if(b.t==='texto')return `<div class="card"><h3>${esc(b.q||'Texto')}</h3><div class="txt">${esc(b.x||'')}</div></div>`;
 if(b.t==='audio')return `<div class="card"><h3>${esc(b.q||'Ouve o artigo')}</h3><audio controls preload="none" style="width:100%" data-media="${esc(b.url||'')}"></audio></div>`;
 if(b.t==='perguntas')return `<div class="card"><h3>${esc(b.q||'Que pergunta gostavas de fazer?')}</h3><form data-form="pergunta"><div class="row"><div><label for="n${bi}">Primeiro nome ou alcunha</label><input id="n${bi}" name="nome" maxlength="30" autocomplete="off"></div><div style="flex:0 1 120px"><label for="t${bi}">Turma</label><input id="t${bi}" name="turma" maxlength="10" autocomplete="off"></div></div><label for="x${bi}">A tua pergunta</label><textarea id="x${bi}" name="texto" maxlength="400" required></textarea><div class="row" style="margin-top:10px"><button class="btn pri" style="flex:0 0 auto">Enviar pergunta</button><span class="msg"></span></div><p class="note">Os jornalistas escolhem as melhores para a entrevista.</p></form></div>`;
 return '';
}
main.addEventListener('click',async ev=>{
 const t=ev.target.closest('[data-act]');if(!t||!atual||!main.contains(t))return;
 const act=t.dataset.act;if(act!=='vote'&&act!=='foto')return;
 const {e,a}=atual,ch=t.dataset.ch;t.disabled=true;
 try{
  const meus=await db.meus(e.n,a.id);
  if(act==='foto')await db.votar(e.n,a.id,ch,meus[ch]!=null?null:'1');
  else{const op=t.dataset.op;await db.votar(e.n,a.id,ch,(t.dataset.toggle&&meus[ch]===op)?null:op)}
 }catch(err){console.warn(err)}
 verArtigo(e,a);
});
main.addEventListener('submit',async ev=>{
 const f=ev.target.closest('form[data-form]');if(!f||!atual)return;ev.preventDefault();
 const msg=f.querySelector('.msg'),fd=new FormData(f),texto=String(fd.get('texto')||'').trim();
 if(texto.length<3){msg.className='msg err';msg.textContent='Escreve um pouco mais.';return}

function parseImport(txt){
 txt=txt.trim();if(!txt)return [];
 if(txt[0]==='{'||txt[0]==='['){const j=JSON.parse(txt);return {json:j}}
 const usados=new Set();
 return txt.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split('|').map(x=>x.trim());
  let pag='',sec='',ti=l;if(p.length>=3){[pag,sec]=p;ti=p.slice(2).join(' ')}else if(p.length===2){[pag,ti]=p}
  let id=slug(ti),k=2;while(usados.has(id))id=slug(ti)+'-'+k++;usados.add(id);
  return {id,p:pag.replace(/\D/g,'')||pag,s:sec||'Notícias',ti,b:[{t:'reacoes'},{t:'comentario',q:'Deixa a tua opinião'}]}});
}

/* --- Códigos QR --- */
function qrImg(url,titulo,sub){
 if(!window.qrcode)return '';
 const qr=window.qrcode(0,'M');qr.addData(url);qr.make();
 const n=qr.getModuleCount(),cell=10,m=4*cell,W=n*cell+2*m,H=W+64;
 const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
 x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#16181d';
 for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(qr.isDark(r,k))x.fillRect(m+k*cell,m+r*cell,cell,cell);
 x.textAlign='center';x.font='600 26px Fredoka, sans-serif';x.fillText(titulo,W/2,W+14);
 x.font='18px "Source Sans 3", sans-serif';let s=sub;while(x.measureText(s).width>W-24&&s.length>4)s=s.slice(0,-2);if(s!==sub)s=s.trim()+'…';x.fillText(s,W/2,W+44);
 return c.toDataURL('image/png');
}

 <p class="note">Descarrega cada imagem e arrasta-a para o Canva, junto ao artigo. O primeiro é para a capa e abre a lista de todos os artigos.</p>
 <div class="qrgrid">${itens.map((it,i)=>{const url=it.url||urlArtigo(e,it.a),src=qrImg(url,it.t,it.s);return `<div class="card"><img src="${src}" alt="Código QR: ${esc(it.s)}"><p style="margin:8px 0 4px;font-weight:700;line-height:1.25">${esc(it.a?it.a.ti:(it.nome||'Capa: todos os artigos'))}</p><p class="note" style="margin:0 0 8px">${it.a?'pág. '+esc(it.a.p):'N.º'+e.n}</p><div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap"><a class="btn sm" href="${src}" download="${esc(it.f)}.png" style="text-decoration:none;line-height:26px">Descarregar</a><button class="btn sm" data-url="${esc(url)}">Copiar ligação</button></div></div>`}).join('')}</div>`;

/* Reduz para 2400 px e regrava em JPG: a foto fica leve e perde a localização GPS. */
async function comprimir(file){
 try{const bm=await createImageBitmap(file),s=Math.min(1,2400/Math.max(bm.width,bm.height)),c=document.createElement('canvas');
  c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bm,0,0,c.width,c.height);if(bm.close)bm.close();
  const b=await new Promise(ok=>c.toBlob(ok,'image/jpeg',.88));if(b)return b}catch(e){}
 if(file.size<=10e6&&/^image\//.test(file.type))return file;
 throw new Error('imagem');
}

 <details open><summary>Notícia</summary><p>Conta o que aconteceu, do mais importante para o menos importante. O primeiro parágrafo responde a <b>quem</b>, <b>o quê</b>, <b>quando</b> e <b>onde</b>; os seguintes explicam <b>como</b> e <b>porquê</b>. Frases curtas, uma ideia por parágrafo.</p>
 <p class="ex">Exemplo inventado: Na quarta-feira, 12 de novembro, cerca de 80 alunos do 2.º ciclo participaram na limpeza da praia do porto da Calheta. A atividade foi organizada pela Brigada Eco-escola e recolheu doze sacos de lixo, sobretudo plástico.

/* --- 10: verificação antes de enviar --- */
function verificar(f){
 const out=[],T=String(f.titulo||'').trim(),nt=palavras(T),pal=palavras(f.texto),pars=String(f.texto||'').split(/\n+/).filter(p=>p.trim()),longos=pars.filter(p=>palavras(p)>110).length;
 out.push([!!T&&nt<=12,!T?'Falta o título':nt<=12?'Título curto e direto':'O título tem '+nt+' palavras: tenta ficar até 12']);
 out.push([!!String(f.entrada||'').trim(),String(f.entrada||'').trim()?'Tem entrada':'Sem entrada: uma frase a resumir ajuda o leitor']);
 out.push([pal>=80,pal>=80?'Texto com '+pal+' palavras':'Texto curto ('+pal+' palavras)']);
 out.push([!longos,longos?longos+(longos===1?' parágrafo muito longo':' parágrafos muito longos')+': divide-os':'Parágrafos com bom tamanho']);
 const temData=/(\d{1,2}\s+de\s+[a-zç]+|\d{1,2}\/\d{1,2}|segunda|terça|quarta|quinta|sexta|sábado|domingo|ontem|semana passada|dia\s+\d)/i.test(f.texto||'');
 out.push([temData,temData?'Diz quando aconteceu':'Não encontrei a data: diz quando aconteceu']);
 if((f.fotos||[]).length){const s=f.fotos.filter(x=>!String(x.legenda||'').trim()).length;out.push([!s,s?s+(s===1?' foto sem legenda':' fotos sem legenda'):'Todas as fotos têm legenda'])}
 const grita=/[A-ZÁÉÍÓÚÂÊÔÃÕÇ ]{25,}/.test(f.texto||'');out.push([!grita,grita?'Há frases inteiras em maiúsculas':'Sem frases em maiúsculas']);
 return out;
}

 <div class="row" style="margin-top:12px"><button class="btn pri" id="k-dl" style="flex:0 0 auto">Descarregar cartão (PNG)</button><span class="note">Imprime em tamanho de cartão (8,5 × 5,4 cm) e plastifica.</span></div>`;
 const fontes=document.fonts&&document.fonts.load?Promise.all(['400 60px "UnifrakturMaguntia"','700 30px "Kalam"','600 60px "Fredoka"','400 20px "Source Sans 3"'].map(f=>document.fonts.load(f).catch(()=>{}))):Promise.resolve();
 const draw=async()=>{await fontes;const n=$('#k-n').value.trim()||'O teu nome',t=$('#k-t').value.trim(),f=$('#k-f').value;LS.set('rc-cartao',{n:$('#k-n').value,t,f});
  const W=1012,H=638,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext&&cv.getContext('2d');if(!x)return;
  x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#16181d';x.textAlign='center';x.font='400 76px "UnifrakturMaguntia", serif';x.fillText('Repórter da Calheta',W/2,104);
  x.fillRect(40,128,W-80,5);x.fillRect(40,138,W-80,2);x.font='19px "Source Sans 3", sans-serif';x.fillStyle='#5b5f6d';x.fillText('Jornal da Escola Básica e Secundária da Calheta · São Jorge',W/2,174);
  x.save();x.translate(70,262);x.rotate(-0.03);x.font='700 34px "Kalam", cursive';x.textAlign='left';const tw=x.measureText(f).width;x.fillStyle='#ffd84d';x.fillRect(0,-38,tw+30,50);x.fillStyle='#16181d';x.fillText(f,15,0);x.restore();
  x.textAlign='left';x.fillStyle='#1f5fbf';let fs=72;x.font=`600 ${fs}px "Fredoka", sans-serif`;while(x.measureText(n).width>W-380&&fs>36){fs-=4;x.font=`600 ${fs}px "Fredoka", sans-serif`}x.fillText(n,70,362);
  x.fillStyle='#16181d';x.font='600 30px "Source Sans 3", sans-serif';if(t)x.fillText('Turma '+t.replace(/^turma\s*/i,''),70,414);
  const d=new Date(),y=d.getMonth()>=8?d.getFullYear():d.getFullYear()-1;x.font='26px "Source Sans 3", sans-serif';x.fillStyle='#5b5f6d';x.fillText('Ano letivo '+y+'/'+(y+1),70,458);
  if(window.qrcode){const q=window.qrcode(0,'M');q.addData(cfg.base||location.href.split('#')[0]);q.make();const mc=q.getModuleCount(),s=Math.floor(200/mc),ox=W-70-mc*s,oy=236;x.fillStyle='#16181d';for(let r=0;r<mc;r++)for(let k=0;k<mc;k++)if(q.isDark(r,k))x.fillRect(ox+k*s,oy+r*s,s,s);x.font='600 18px "Source Sans 3", sans-serif';x.textAlign='center';x.fillText('Participa',ox+mc*s/2,oy+mc*s+26)}
  x.fillStyle='#ffd84d';x.fillRect(0,H-26,W,26);$('#k-img').src=cv.toDataURL('image/png')};
 rp.oninput=draw;rp.onchange=draw;draw();
 $('#k-dl').onclick=()=>{const s=$('#k-img').src;if(s&&s.startsWith('data:'))baixar(d2b(s),'cartao-'+slug($('#k-n').value||'jornalista')+'.png')};
}

/* --- 16: lembretes de prazo --- */
function lembreteHTML(info,minhas){
 const out=[];
 if(info.prazo&&info.aberta!==false){const d=Math.round((new Date(info.prazo+'T00:00')-new Date(new Date().toDateString()))/864e5);if(d>=0&&d<=3)out.push(d===0?'Hoje é o último dia para entregar artigos!':d===1?'Falta 1 dia para o fim do prazo.':`Faltam ${d} dias para o fim do prazo.`)}
 const alt=minhas.filter(s=>s.estado==='alteracoes').length;if(alt)out.push(`Tens ${alt} ${alt===1?'artigo':'artigos'} à espera de correção: vê em "Os meus artigos".`);
 return out.length?`<div class="notaeq" style="margin:0 0 14px">${out.map(esc).join('<br>')}</div>`:'';
}

/* --- 5, 6: áudio e inglês no editor de edições --- */
function escolherAudio(i,q){const inp=document.createElement('input');inp.type='file';inp.accept='audio/*';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;try{const cb=limpaTipo(f);const url=await db.subirPublico(cb,extA(cb));rasc.artigos[i].b.push({t:'audio',q:q||'Ouve o artigo',url});editor()}catch(e){console.warn(e)}};inp.click()}
async function publicarAudios(r,btn){
 for(const a of r.artigos)for(const b of a.b){if(b.t!=='audio'||!String(b.url||'').startsWith('sub:'))continue;
  try{if(btn)btn.textContent='A publicar o áudio…';const bl=await db.blobFoto(b.url.slice(4));if(!bl)throw 0;b.url=await db.subirPublico(limpaTipo(bl),extA(bl))}catch(e){console.warn(e);b.url=''}}
 r.artigos.forEach(a=>{a.b=a.b.filter(b=>b.t!=='audio'||b.url)});
}

/* --- 4, 7, 22, 2: extras do editor de edições --- */
function extrasEdicao(r){
 const c=r.capa||{},cc=r.caca||[];
 return `<div class="card"><h3>Pergunta da capa</h3><p class="note" style="margin-top:0">Aparece no topo da página da edição, a que o QR da capa abre. O resultado mostra-se no número seguinte.</p><div class="row"><div style="flex:2 1 260px"><label for="cq">Pergunta</label><input id="cq" value="${esc(c.q||'')}" maxlength="160"></div><div style="flex:2 1 260px"><label for="co">Opções, separadas por vírgula</label><input id="co" value="${esc((c.o||[]).join(', '))}"></div></div></div>
 <div class="card"><h3>Caça ao QR (${cc.length} ${cc.length===1?'pista':'pistas'})</h3><p class="note" style="margin-top:0">Esconde códigos QR pela escola. Cada pista tem uma pergunta sobre um artigo e as respostas certas dão pontos à turma. Os QR aparecem em Códigos QR.</p>
 ${cc.map((p,i)=>`<div class="row" style="align-items:end"><div style="flex:1 1 140px"><label for="cc${i}l">Onde fica</label><input id="cc${i}l" data-cc="${i}" data-k="local" value="${esc(p.local)}" placeholder="ex.: Biblioteca"></div><div style="flex:2 1 220px"><label for="cc${i}q">Pergunta</label><input id="cc${i}q" data-cc="${i}" data-k="q" value="${esc(p.q)}"></div><div style="flex:2 1 220px"><label for="cc${i}o">Opções (* na certa)</label><input id="cc${i}o" data-cc="${i}" data-k="o" value="${esc((p.o||[]).filter(Boolean).map((o,j)=>(j===p.c?'*':'')+o).join(', '))}"></div><button type="button" class="btn sm" data-ccrm="${i}" style="flex:0 0 auto">Remover</button></div>`).join('')}
 <button type="button" class="btn sm" id="ccadd" style="margin-top:10px">+ Pista</button></div>
 <div class="card"><h3>Edição digital (PDF)</h3><p class="note" style="margin-top:0">Exporta o jornal do Canva em PDF e carrega-o aqui (até 50 MB). Fica na página "Ler o jornal", com ligações aos artigos de cada página.</p><div class="row" style="align-items:center"><span style="flex:2 1 200px">${r.pdf?'<span class="ok">PDF carregado.</span>':'Sem PDF.'}</span><button type="button" class="btn sm" id="pdfb" style="flex:0 0 auto">${r.pdf?'Trocar PDF':'Carregar PDF'}</button>${r.pdf?'<button type="button" class="btn sm" id="pdfrm" style="flex:0 0 auto">Retirar</button>':''}<input type="file" id="pdff" accept="application/pdf" class="hide"><span class="msg" id="pdfmsg"></span></div></div>
 <div class="row" style="margin:6px 0 14px"><button type="button" class="btn sm" id="quized" style="flex:0 0 auto">+ Artigo "Quiz da edição"</button><span class="note" style="flex:3 1 240px;margin:0">Cria um artigo só com perguntas sobre os outros artigos; depois junta-lhe blocos de quiz.</span></div>`;
}
function bindExtras(r,sync){
 const cap=()=>{const q=$('#cq').value.trim(),o=$('#co').value.split(',').map(x=>x.trim()).filter(Boolean);r.capa=q?{t:'sondagem',q,o}:null};
 const ccs=()=>pane().querySelectorAll('[data-cc]').forEach(x=>{const p=r.caca[x.dataset.cc];if(!p)return;if(x.dataset.k==='o'){const os=x.value.split(',').map(y=>y.trim()).filter(Boolean);p.c=Math.max(0,os.findIndex(y=>y.startsWith('*')));p.o=os.map(y=>y.replace(/^\*/,'').trim())}else p[x.dataset.k]=x.value.trim()});
 const tudo=()=>{sync();cap();ccs()};
 $('#cq').oninput=cap;$('#co').oninput=cap;pane().querySelectorAll('[data-cc]').forEach(x=>x.oninput=ccs);
 $('#ccadd').onclick=()=>{tudo();(r.caca=r.caca||[]).push({id:Math.random().toString(36).slice(2,7),local:'',q:'',o:[],c:0});editor()};
 pane().querySelectorAll('[data-ccrm]').forEach(b=>b.onclick=()=>{tudo();r.caca.splice(Number(b.dataset.ccrm),1);editor()});
 $('#quized').onclick=()=>{tudo();if(!r.artigos.some(a=>a.s==='Quiz da edição'))r.artigos.push({id:'quiz-da-edicao',p:'',s:'Quiz da edição',ti:'Quiz da edição: leste o jornal todo?',b:[]});editor()};
 $('#pdfb').onclick=()=>$('#pdff').click();
 $('#pdff').onchange=async()=>{const f=$('#pdff').files[0];if(!f)return;const m=$('#pdfmsg');m.className='msg';m.textContent='A carregar…';try{tudo();r.pdf=await db.subirPublico(f,'pdf');editor()}catch(e){console.warn(e);m.className='msg err';m.textContent='Não foi possível carregar.'}};
 const rm=$('#pdfrm');if(rm)rm.onclick=()=>{tudo();r.pdf='';editor()};
}
function extrasQR(e,base){
 return (e.caca||[]).map((c,i)=>({a:null,url:base+'#caca-'+e.n+'-'+c.id,t:'Caça ao QR',s:'Pista '+(i+1)+(c.local?' · '+c.local:''),nome:'Caça ao QR · pista '+(i+1)+(c.local?' ('+c.local+')':''),f:'QR-n'+e.n+'-caca-'+(i+1)}))
  .concat([{a:null,url:base+'#familias',t:'Famílias',s:'Deixa uma mensagem à escola',nome:'Mural das famílias',f:'QR-familias'},{a:null,url:base+'#redacao',t:'Redação',s:'Envia o teu artigo',nome:'Redação (para os jornalistas)',f:'QR-redacao'}]);
}

/* --- 12, 19, 20 e turmas: separador Escola --- */
const grupoTurma=L=>{const g={};L.forEach(a=>(g[a.turma]=g[a.turma]||[]).push(a.nome+(a.obs?' ('+a.obs+')':'')));return Object.keys(g).sort().map(t=>`<b>${esc(t)}:</b> ${g[t].map(esc).join(', ')}`).join('<br>')};
async function pEscola(){
 const R=await Promise.all([db.getDef('turmas',[]),db.professores(),db.autorizacoes(),db.subs(),db.meuEmail()].map(p=>p.catch(e=>{console.warn(e);return null})));
 const turmas=R[0]||[],profs=R[1]||[],aut=R[2]||[],subs=R[3]||[],eu=R[4]||'',sem=aut.filter(a=>!a.autoriza);
 const autores=[...new Set(subs.filter(s=>s.estado==='publicado'||s.estado==='aceite').map(s=>s.autores))].sort();
 const port=subs.filter(s=>s.autores===portAutor&&(s.estado==='publicado'||s.estado==='aceite')).sort((a,b)=>(a.edicao||0)-(b.edicao||0)||(parseInt(a.pagina)||0)-(parseInt(b.pagina)||0));
 pane().innerHTML=`<div class="card"><h3>Turmas da escola</h3><p class="note" style="margin-top:0">Os leitores escolhem a turma desta lista para o concurso entre turmas. Uma turma por linha.</p><textarea id="es-t" style="min-height:120px" placeholder="5.º A&#10;5.º B&#10;6.º A">${esc(turmas.join('\n'))}</textarea><div class="row" style="margin-top:8px"><button class="btn sm pri" id="es-ts" style="flex:0 0 auto">Guardar turmas</button><span class="msg" id="es-tm"></span></div></div>
 <div class="card"><h3>Equipa de professores</h3><p class="note" style="margin-top:0">Cada professor pode ficar com secções; na Redação vê primeiro os artigos das suas secções. Um professor novo precisa também de conta no Supabase (Authentication → Users), com o mesmo email.</p>
 ${profs.map((p,i)=>`<div class="row" style="align-items:end"><div style="flex:2 1 240px"><label for="es-s${i}">${esc(p.email)}${p.email===eu?' (tu)':''}</label><input id="es-s${i}" data-sec="${i}" value="${esc((p.seccoes||[]).join(', '))}" placeholder="Secções, separadas por vírgula"></div><button class="btn sm" data-psave="${i}" style="flex:0 0 auto">Guardar</button>${p.email!==eu?`<button class="btn sm" data-pdel="${i}" style="flex:0 0 auto">${confirmar==='prof'+p.email?'Confirmar?':'Retirar'}</button>`:''}</div>`).join('')}
 <div class="row" style="align-items:end;margin-top:12px"><div style="flex:2 1 240px"><label for="es-pe">Acrescentar professor (email)</label><input id="es-pe" type="email"></div><button class="btn sm" id="es-pa" style="flex:0 0 auto">Acrescentar</button><span class="msg" id="es-pm"></span></div></div>
 <div class="card"><h3>Autorizações de imagem</h3><p class="note" style="margin-top:0">Cola a lista, uma linha por aluno: <b>turma | nome | sim ou não | observação</b>. Na Redação aparece um aviso quando um artigo com fotos vem de uma turma com alunos sem autorização. Só os professores veem esta lista.</p>
 <textarea id="es-a" style="min-height:140px" placeholder="8.º A | Ana Silva | sim&#10;8.º A | Rui Melo | não | só de costas">${esc(aut.map(a=>[a.turma,a.nome,a.autoriza?'sim':'não'].concat(a.obs?[a.obs]:[]).join(' | ')).join('\n'))}</textarea>
 <div class="row" style="margin-top:8px"><button class="btn sm pri" id="es-as" style="flex:0 0 auto">Guardar lista</button><span class="msg" id="es-am"></span></div>
 ${sem.length?`<p style="margin-bottom:0"><b>Sem autorização (${sem.length})</b><br>${grupoTurma(sem)}</p>`:aut.length?'<p class="ok">Todos os alunos da lista têm autorização.</p>':''}</div>
 <div class="card"><h3>Portefólio de um jornalista</h3><p class="note" style="margin-top:0">Os artigos aceites e publicados de cada autor, para a avaliação.</p><select id="es-pf" aria-label="Autor"><option value="">Escolhe o autor…</option>${autores.map(a=>`<option ${a===portAutor?'selected':''}>${esc(a)}</option>`).join('')}</select>
 ${portAutor?`<table class="t" style="margin-top:12px"><thead><tr><th>N.º</th><th>Pág.</th><th>Artigo</th><th class="nu">Palavras</th><th class="nu">Fotos</th><th>Estado</th></tr></thead><tbody>${port.map(s=>`<tr><td>${esc(s.edicao||'')}</td><td>${esc(s.pagina||'')}</td><td>${esc(s.titulo)}<br><span class="note">${esc(s.seccao||'')}</span></td><td class="nu">${palavras(s.texto)}</td><td class="nu">${(s.fotos||[]).length}</td><td>${esc((ESTADOS[s.estado]||[''])[0])}</td></tr>`).join('')}</tbody></table><button class="btn sm" id="es-pc" style="margin-top:10px">Copiar lista</button>`:''}</div>`;
 const msg=(id,t,ok)=>{const el=$(id);if(el){el.className='msg '+(ok?'ok':'err');el.textContent=t}};
 $('#es-ts').onclick=async()=>{const L=[...new Set($('#es-t').value.split('\n').map(fmtT).filter(Boolean))];try{await db.setDef('turmas',L);$('#es-t').value=L.join('\n');msg('#es-tm','Guardado: '+L.length+' turmas.',1)}catch(e){console.warn(e);msg('#es-tm','Não foi possível guardar.')}};
 $('#es-as').onclick=async()=>{const rows=$('#es-a').value.split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(p=>p[1]).map(([t,n,a,o])=>({turma:fmtT(t),nome:n.slice(0,120),autoriza:/^(s|sim|y|yes|1|x)/i.test(a||''),obs:(o||'').slice(0,200)}));try{await db.guardarAutorizacoes(rows);pEscola()}catch(e){console.warn(e);msg('#es-am','Não foi possível guardar.')}};
 $('#es-pa').onclick=async()=>{const em=$('#es-pe').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(em))return msg('#es-pm','Email inválido.');try{await db.guardarProfessor({email:em,seccoes:[]});pEscola()}catch(e){console.warn(e);msg('#es-pm','Não foi possível acrescentar.')}};
 $('#es-pf').onchange=()=>{portAutor=$('#es-pf').value;pEscola()};
 const pc=$('#es-pc');if(pc)pc.onclick=async()=>{const t='Portefólio de '+portAutor+'\n'+port.map(s=>`n.º${s.edicao||'?'} pág. ${s.pagina||'?'} · ${s.titulo} (${palavras(s.texto)} palavras, ${(s.fotos||[]).length} fotos)`).join('\n');try{await navigator.clipboard.writeText(t);pc.textContent='Copiado!'}catch(e){pc.textContent='Não deu para copiar'}};
 pane().onclick=async ev=>{const b=ev.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.psave){const p=profs[d.psave];try{await db.guardarProfessor({email:p.email,seccoes:pane().querySelector(`[data-sec="${d.psave}"]`).value.split(',').map(x=>x.trim()).filter(Boolean)});b.textContent='Guardado!'}catch(e){console.warn(e);b.textContent='Erro'}}
  if(d.pdel){const p=profs[d.pdel];if(confirmar!=='prof'+p.email){confirmar='prof'+p.email;return pEscola()}confirmar=null;try{await db.apagarProfessor(p.email)}catch(e){console.warn(e)}pEscola()}};
}

window.addEventListener('hashchange',()=>{if(location.hash!=='#painel')main.classList.remove('wide')});
window.addEventListener('hashchange',()=>{document.body.classList.toggle('tvmode',location.hash==='#tv');main.onclick=null});
init();
}
